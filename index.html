 kids:{who:"all", do:"Wait for the clock, then count the carved figures as they come out and walk round. Wave at each one.", find:"The well in the middle of the courtyard.", how:"You are in a stone courtyard with covered walkways on all sides and a well in the middle. The clock hangs high on the wall to your left as you come in through the passage. IMPORTANT: it only plays on ODD hours — 9, 11, 1, 3 and 5. If you arrive at 10 or 12 there is nothing to watch, so check a watch before you promise the children anything. When it does play, a small door opens and carved figures come out one at a time and go round. Six of them. Music plays throughout, about a minute. The well is a low stone circle in the middle of the yard, easy to miss."},
 sources:[["Kraków Travel: Collegium Maius","https://krakow.travel/en/17706-krakow-collegium-maius-and-the-jagiellonian-university"],["Kraków Travel: the legend of Nawojka","https://krakow.travel/en/artykul/107/the-legend-of-nawojka"]]},

{id:"planty", addr:"Barbakan, ul. Basztowa, 31-134 Kraków", day:"d1", seg:0, ord:0, tag:"all", svg:"barbican",
 title:"The Planty and the Barbican", sub:"A city that sold its walls and bought a park", era:"1810 onwards",
 story:[
 "Kraków sold its walls and bought a park. The city had no wall at all as late as the 13th century, which ended badly when a Tatar raid destroyed it. Building then ran until the early 1300s, with the Barbican added at the end of the 1400s. Seven gates led in, all closed at night.",
 "By the early 19th century, under Austrian rule, roughly two kilometres of circuit with 47 towers and 8 gates stood in poor repair. In 1810 the Emperor ordered the walls demolished and the moat filled, hoping for a modern open city, and the decision caused a furious row.",
 "One professor from the university, sitting in the city senate, fought to save part of it. His winning argument was not military history. He claimed the remaining walls sheltered the city from winds that would otherwise lift the dresses of respectable Kraków ladies. It worked. The gate, the Barbican and three towers survive because of that speech."],
 why:"Between 1822 and 1830 gardeners planted the cleared strip and made a green ring four kilometres round, enclosing the whole centre. No other European city sits inside a park where its walls used to be. You cross it repeatedly over three days, and it explains the shape of everything else: the Old Town ends where the trees begin, and that line is the medieval boundary. It is also the smoothest pram route in the city.",
 look:["The Barbican is a circular brick fortress with walls three metres thick, and counts as the best preserved example in Europe. Only three such outposts survive anywhere.",
 "East of it, three medieval towers still stand among the gardens, named after the guilds that once defended them: the joiners, the haberdashers and the carpenters. Walk through St Florian's Gate into the Old Town rather than round it. Many of the trees date from the 1820s planting, so some of what shades you was put in by the people who pulled the walls down."],
 guesses:[
 {q:"How many towers stood on the medieval city wall?", a:"Forty-seven, plus eight gates. Two kilometres of circuit, all of it pulled down in a decade.", src:"here"},
 {q:"How many arrow loops pierce the Barbican?", a:"One hundred and thirty, through walls three metres thick. It was built to be shot out of from every angle at once.", src:"away"}],
 act:{type:"truefalse", kind:"True or false",
  prompt:"True or false: the Barbican survives because a professor argued the walls protected Kraków's women from having their dresses blown up by the wind.",
  answer:true, note:"True, and it is the reason the best-preserved barbican in Europe still stands. He knew a military argument would not move the Austrians, so he made a decency argument instead."},
 verdict:{answer:"Older than it looks", note:"The trees and paths date from the 1820s. The shape they trace is 13th century, and the two stone fragments are the real thing."},
 links:[["Kraków Travel: the city walls","https://krakow.travel/en/470-krakow-city-walls"]],
 kids:{who:"all", do:"Count the pointed tower tops on the round fort. There are more than you think.", find:"An arrow slit low enough to look through at their own height.", how:"You are standing at the Barbican, a round brick fort with a pointed roof, just outside St Florian's Gate on the north edge of the Old Town. The turrets are the little pointed spikes round the top of the wall: there are seven. Count them together out loud. For the hunt, walk round the outside at child height and look for a narrow vertical slot in the brickwork, wider inside than out. Some sit low enough for a four-year-old to put an eye to. Expect ten minutes."},
 sources:[["Kraków Travel: city walls and the dress argument","https://krakow.travel/en/470-krakow-city-walls"],["Wikipedia: Planty Park","https://en.wikipedia.org/wiki/Planty_Park_(Krak%C3%B3w)"]]},

{id:"adalbert", addr:"Kościół św. Wojciecha, Rynek Główny 3, 31-042 Kraków", day:"d1", seg:0, ord:2, tag:"all", svg:"adalbert",
 title:"St Adalbert's", sub:"The church that predates the square", era:"11th century",
 story:[
 "Adalbert died badly, and Poland gained enormously from the death. A Czech nobleman born around 956, he became bishop of Prague at twenty-seven, then lost the job twice for pushing reforms his own clergy resented. He travelled north to convert the pagan Prussians on the Baltic coast, and on 23 April 997 a group of them ambushed him after Mass and killed him.",
 "Duke Bolesław the Brave bought the body back for its weight in gold and enshrined it at Gniezno. Rome declared Adalbert a saint within two years, and the tomb drew a Holy Roman Emperor on pilgrimage in the year 1000. Poland gained its own archbishop and its own martyr. A young Christian kingdom with borrowed priests answered to the German church. A kingdom with a shrine of its own answered to nobody.",
 "Tradition claims Adalbert preached on this exact spot before leaving on that final journey."],
 why:"Standing here you stand at the point where Poland stopped counting as somebody else's mission field. The building also tells the square's whole history in one wall: a wooden church in the late 900s, rough limestone in the 1000s, neat blocks around 1100, then the city grid laid around it in 1257, then centuries of repaving that drowned it.",
 look:["The church sits at a stubborn angle to everything else, because it was already here when the square was laid out around it in 1257. Repaving lifted the ground by two to two and a half metres, so in the 1600s builders raised the whole structure about four metres, added brick, cut the round windows and capped the nave with a dome.",
 "Find the steps going down. Original stonework and a doorway survive almost two metres below today's paving. The circular windows belong to the 17th-century raising, not the medieval church, so you are looking at two eras in one wall."],
 guesses:[
 {q:"How far has the ground level of this square risen in a thousand years?", a:"Two to two and a half metres, which is why the church looks sunk.", src:"here"},
 {q:"How many steps lead down to the original medieval doorway?", a:"Count them as you go down. The old floor sits almost two metres below the paving you are standing on.", src:"away"}],
 act:{type:"label", kind:"Diagram labelling", prompt:"None of these labels name their own position, so you will have to work each one out.",
  svg:"adalbert",
  pins:[{x:200,y:60,a:"Baroque, and the newest thing on the whole building"},
        {x:176,y:104,a:"Cut through Romanesque stone six centuries after it was laid"},
        {x:200,y:128,a:"Where you are standing"},
        {x:200,y:186,a:"Where the first worshippers stood"}],
  note:"The whole building is a Romanesque church wearing a Baroque hat, hoisted bodily out of a rising square."},
 verdict:{answer:"Older than it looks", note:"Older, and physically higher, than it was ever meant to be."},
 links:[["VisitMałopolska: St Adalbert's","https://visitmalopolska.pl/en_GB/obiekt/-/poi/kosciol-pw-sw-wojciecha-w-krakowie"]],
 kids:{who:"all", do:"Count the steps going down into the sunken church, out loud, together.", find:"The round window high in the wall.", how:"The smallest church on the Main Square, white, with a dome, sitting at a funny angle in the corner nearest Grodzka Street. It looks sunk into the ground because it is. Go round to the entrance and you will find steps leading DOWN into it: count them on the way in, out loud, and again on the way out to check. The round window is high on the outside wall, circular rather than pointed, and there are two. Inside is tiny and takes two minutes."},
 sources:[["Polish History: Saint Adalbert","https://polishhistory.pl/saint-adalbert-martyr-and-patron-saint-of-poland/"],["Kraków Travel","https://krakow.travel/en/355-krakow-kosciol-sw-wojciecha"]]},

{id:"homage", addr:"Rynek Główny (paving by the Town Hall Tower), 31-042 Kraków", day:"d1", seg:0, ord:4, tag:"all", svg:"sukiennice",
 title:"The Prussian Homage plaque", sub:"The enemy who knelt", era:"1525",
 story:[
 "A crusading order of German warrior-monks spent three centuries as Poland's most dangerous enemy, and on this spot the last of them knelt. Founded in the Holy Land in 1190, the Teutonic Knights moved to the Baltic in the 1230s, backed by pope and emperor, to conquer the pagan Prussians. The Knights kept the land, built a state of their own, and cut Poland off from the sea. A Polish-Lithuanian army broke them at Grunwald in 1410.",
 "On 10 April 1525, on this square, Albrecht Hohenzollern, the last Grand Master, dissolved the order's state, knelt before King Sigismund the Old, and received the new Duchy of Prussia back as a hereditary fief. The enemy became a tenant.",
 "Three centuries later the story curdled. Prussia grew into the kingdom that helped erase Poland from the map in 1795, and by the 1880s governed a large slice of Polish territory while stamping out the Polish language there. Poles under occupation reached for 1525 as proof the arrangement had once run the other way."],
 why:"Jan Matejko, born in Kraków in 1838 and known ever since as the painter of Polish history, put that idea in front of them. Cheap prints of his work hung in Polish homes across all three occupied zones and taught a generation their own past. He funded the failed 1863 uprising out of his own pocket. When his huge canvas of this scene first hung at Wawel, the Austrian garrison allowed a fortnight, then stopped the show, because Poles kept arriving and treating the viewing as a patriotic rally.",
 look:["The plaque is set into the paving near the Town Hall Tower. Stand on it, then look around at the square Matejko painted, and note what he changed. He drew the Cloth Hall in its later Renaissance form and St Mary's tower as remodelled in 1529, neither correct for 1525, so that 19th-century Poles would recognise the square as their own.",
 "You see the painting itself this afternoon, if it is hanging. Two faces in it are Matejko's own: the architect standing bottom left holding a sealed document, and the court jester. That jester recurs across his work as the fool who grasps the coming catastrophe while the court celebrates."],
 guesses:[
 {q:"In what year did a Polish-Lithuanian army finally break the Teutonic Knights?", a:"1410, at Grunwald, still one of the largest battles of medieval Europe.", src:"here"},
 {q:"How wide is Matejko's canvas of this scene?", a:"Just under eight metres, 785cm by 388cm. It needs a wall, not a room.", src:"away"}],
 act:{type:"mcq", kind:"Multiple choice",
  prompt:"Matejko painted the buildings on this square wrong on purpose. Why?",
  opts:["He had never seen the square himself","So 19th-century Poles would recognise it as their own square","The Austrian censor demanded changes","He was copying an older painting"],
  answer:1, note:"He drew the buildings as they looked in his own century, not in 1525. The point was recognition, not accuracy."},
 verdict:{answer:"A fake", note:"The event is real and dated. The painting deliberately falsifies its own architecture, and the fake is the point."},
 links:[["National Museum: catalogue entry","http://www.imnk.pl/gallerybox.php?dir=SU321&lang=EN"]],
 kids:{who:"parallel", do:"Nothing here for them. This is a plaque in the paving, so send them fifty metres to the giant bronze head while the adults read it.", find:"Nothing. Bank the scale at the Head instead.", how:"A metal plaque set flat into the paving stones near the Town Hall Tower — the tall lone brick tower on the square. Nothing for children here. Point them at the giant bronze head instead, which sits about fifty metres away on the same side, and swap an adult over."},
 sources:[["History Today: the Teutonic Knights","https://www.historytoday.com/archive/battle-grunwald"],["Polish History: Matejko","https://polishhistory.pl/jan-matejko-the-painter-of-polish-history/"]]},

{id:"head", addr:"Eros Bendato, Rynek Główny (by the Town Hall Tower), 31-042 Kraków", day:"d1", seg:0, ord:5, tag:"all", svg:"head",
 title:"The Head", sub:"A bronze antiquity from 1999", era:"1999",
 story:[
 "A giant bronze head lies on its side in the middle of a medieval square, bandaged across the eyes, hollow enough to climb inside. Igor Mitoraj cast it in 1999 and titled it Eros Bendato, meaning Eros bound. He had studied at the Kraków School of Art in the 1960s.",
 "An exhibition of fourteen of his monumental works filled the Rynek from October 2003 to January 2004, and he gave this one to the city, which promptly started an argument about where to put it. Officials first assigned it to the space outside a shopping centre. Mitoraj objected to having his work stand in front of a commercial building. Historians and many locals protested against the square. The square won."],
 why:"Kraków argued in public about whether this belonged here, and the argument was really about what a medieval square is for. Historians and many residents said a working monument to the city's past should not host a modern sculpture. The artist refused to let his work stand outside a shopping centre. The square won, and the head now sits fifty metres from a plaque marking a king receiving homage in 1525. A city that makes its living from its own antiquity had to decide whether it was a museum or a place where people still make things. It chose both.",
 look:["Children go inside, and the open eyes frame a view out across the square.",
 "Send the small ones in and have them describe what they can see from within, while the adults read the Prussian Homage plaque fifty metres away. Mitoraj worked throughout his career on fragmented and damaged human forms, mixing classical sculpture with modern ideas of pain and decay."],
 guesses:[
 {q:"In what year was this made?", a:"1999, and gifted to the city after an exhibition filled the square in 2003.", src:"here"},
 {q:"How much does it weigh?", a:"1,900 kilograms. It is 370cm long, 290 wide and 225 high.", src:"away"}],
 act:{type:"truefalse", kind:"True or false",
  prompt:"True or false: this sculpture is a Roman original, excavated and brought to the square.",
  answer:false, note:"False, and almost nobody guesses 1999 unprompted. It was designed to look broken and ancient. The bandaging that reads as archaeological repair is part of the sculpture."},
 verdict:{answer:"A fake", note:"Deliberately so, and the artist would not object to the word."},
 links:[["In Your Pocket: Eros Bendato","https://www.inyourpocket.com/krakow/eros-bendato_58845v"]],
 kids:{who:"all", do:"Climb inside and look out through an eye. Shout what you can see to whoever is outside.", find:"The bandage wrapped across the eyes.", how:"A huge bronze head, taller than an adult, lying on its side on the paving near the Town Hall Tower. It is hollow: there is an opening at the back and children climb in and stand up inside. Adults should stay outside and look through the eye holes from the front while the children look out. Ask them what they can see. The bandage is the band of bronze wrapped across where the eyes should be, which makes it look broken and mended. Very popular, so expect to queue behind other children."},
 sources:[["History Hit","https://www.historyhit.com/locations/eros-bendato-sculpture/"],["ITS Poland: dimensions","https://its-poland.com/attraction/eros-bendato-monument"]]},

{id:"mickiewicz", addr:"Pomnik Adama Mickiewicza, Rynek Główny, 31-042 Kraków", day:"d1", seg:0, ord:3, tag:"all", svg:"mickiewicz",
 title:"The Mickiewicz monument", sub:"A statue to a poet who never came here", era:"1898, rebuilt 1955",
 story:[
 "Poles built a ten-metre monument to a poet who never once set foot in this city. Adam Mickiewicz died in 1855 and had never visited Kraków alive. Thirty-five years later his remains came from Paris and went into the crypt under Wawel Cathedral, which partly prompted university students to demand a statue.",
 "Getting one built took three separate competitions, because the occupying powers disliked monuments to Polish patriots and because no design felt adequate to the man. The winning entry lost. Teodor Rygier's design came second, and the public demanded it be built anyway. Workers unveiled it in June 1898, the centenary of his birth, to considerable criticism.",
 "On 17 August 1940 the Germans destroyed it. Poles recovered the pieces in 1946 from a scrapyard in Hamburg and rebuilt the monument, unveiling it again on 26 November 1955, the centenary of his death."],
 why:"Three men invented Poland between them, and this completes the set. Długosz wrote the history in his house on Kanonicza. Matejko painted it on the canvas in the Cloth Hall. Mickiewicz wrote the feeling, and his poems fed every 19th-century rising against the empires that had partitioned the country out of existence. Conrad's parents named their son after one of his heroes.",
 look:["Four allegorical figures sit on the steps below the poet: the Motherland, Science, Poetry and Courage. One holds a plaque with an inscription meaning he loved the nation. Walk round all four before anyone guesses which is which.",
 "Kraków calls the whole thing Adaś, a diminutive of Adam, and there is usually a pigeon on his head. This is the city's default meeting point, so use it as your rendezvous if the group splits. Every December the szopki competition, the UNESCO-listed nativity towers, sets up at its foot, which is the one thing September denies you."],
 guesses:[
 {q:"How many design competitions were held before anyone agreed on a monument?", a:"Three, and the design that got built had come second.", src:"here"},
 {q:"The Germans blew it up in 1940. How many years passed before it stood here again?", a:"Fifteen. Rebuilt from parts found in a Hamburg scrapyard and unveiled in 1955, the centenary of his death.", src:"away"}],
 act:{type:"timeline", kind:"Timeline", prompt:"Tap these into order, earliest first.",
  opts:[{l:"Mickiewicz dies in Paris, never having seen Kraków",v:1855},{l:"His remains arrive and go under Wawel Cathedral",v:1890},
        {l:"The monument is unveiled",v:1898},{l:"The Germans destroy it",v:1940},
        {l:"Rebuilt from parts found in a Hamburg scrapyard",v:1955}],
  note:"1855, 1890, 1898, 1940, 1955. A hundred years from death to the statue standing as it does now."},
 verdict:{answer:"A fake", note:"It reads as 1898 and dates from 1955, though much of the bronze is original, salvaged from a German scrapyard. Worth arguing about, because the group will split on whether recovered parts make it genuine."},
 links:[["krakow.wiki: the three competitions","https://krakow.wiki/adam-mickiewicz-monument/"]],
 kids:{who:"all", do:"Four stone people sit on the steps below the poet. Find the one holding a book.", find:"A pigeon on his head. There is nearly always one.", how:"The big dark bronze statue in the middle of the Main Square, on a tall stone base with steps. A man stands on top; four seated figures sit at his feet, one on each side. Walk right round the base to see all four. One of them holds an open book across her lap. There is nearly always a pigeon somewhere on the statue, often on his head or shoulder. This is where everyone in Kraków agrees to meet, so it is also your rendezvous if you split up."},
 sources:[["Wikipedia","https://en.wikipedia.org/wiki/Adam_Mickiewicz_Monument,_Krak%C3%B3w"],["In Your Pocket","https://www.inyourpocket.com/krakow/adam-mickiewicz-monument_31309v"]]},

{id:"hejnal", addr:"Bazylika Mariacka, plac Mariacki 5, 31-042 Kraków", day:"d1", seg:0, ord:8, tag:"all", svg:"stmary",
 title:"The hejnał", sub:"The best story in Kraków, invented in 1925", era:"1392 onwards",
 story:[
 "Every hour a trumpeter leans out of the taller tower of St Mary's and plays five notes, four times, once to each point of the compass. The noon call goes out live on national radio across Poland. And every time, the melody stops dead mid-phrase.",
 "Everyone will tell you why. In 1241 a watchman spotted the Tatars coming, sounded the alarm, and an arrow took him in the throat before he could finish.",
 "That story is about a hundred years old, not eight hundred. In 1925 an American came to Kraków to lecture at the university and asked his guide why the tune broke off. She invented the trumpeter on the spot. He published a children's book called The Trumpeter of Krakow in 1928, and the legend was born. No source records it before then."],
 why:"Poland treats this as one of its oldest living traditions, and it is: the pay records go back to 1392 and the noon call is broadcast on national radio to the whole country every day. But the explanation everybody gives, the arrow in the throat, was invented in 1925 and adopted so completely that it is now taught to Polish schoolchildren. That is a country doing openly what every country does quietly, which is furnishing a genuinely old custom with a better story. Poles know the legend is modern and tell it anyway, because the tune breaking off does need explaining, and a wounded watchman explains it beautifully.",
 look:["Watch which window opens. The trumpeter plays four times, turning between each, and waves at the end. The two towers are deliberately unequal, the taller one 82 metres.",
 "The earliest written mention of the call comes in civic pay records of 1392, and the real origin is unknown. The name comes from the Hungarian word for dawn, pointing at an origin under a Hungarian king of Poland or his daughter. Its original jobs were announcing the opening and closing of the city gates and raising the alarm."],
 guesses:[
 {q:"In what year is the trumpet call first mentioned in writing?", a:"1392, in the city's pay records. Nobody knows who wrote the tune.", src:"here"},
 {q:"Time it. How many seconds from the first note until it cuts off?", a:"Usually a little over ten seconds. Guess first, then count.", src:"away"}],
 act:{type:"truefalse", kind:"True or false",
  prompt:"True or false: the trumpet call stops mid-note to commemorate a trumpeter shot by a Tatar arrow in 1241.",
  answer:false, note:"False, and almost everyone gets this wrong. A Kraków guide invented the story in 1925 to answer an American tourist's question, and put it in a children's book in 1928. The city adopted it wholesale."},
 verdict:{answer:"Older than it looks", note:"The tune is genuinely medieval, recorded in 1392. The famous explanation for it is younger than the Eiffel Tower."},
 links:[["VisitMałopolska: the full debunking","https://visitmalopolska.pl/en_GB/-/hejnal"]],
 kids:{who:"all", do:"Point in each of the four directions as the trumpeter turns. Wave at the end, because he waves back.", find:"The window that opens in the taller tower.", how:"Stand on the Main Square looking at St Mary's church, the big brick one with two unequal towers. The trumpet plays from the TALLER tower, every hour, on the hour. Watch the small window near the top: it opens just before. He plays the same short tune four times, turning to a different direction each time, so the children should turn and point with him. It stops suddenly mid-note, which is the whole joke. He waves at the end, so wave first. Get there two or three minutes early."},
 sources:[["VisitMałopolska","https://visitmalopolska.pl/en_GB/-/hejnal"],["Google Arts & Culture","https://artsandculture.google.com/story/st-mary-s-trumpet-call-international-cultural-centre/2QWRZuvR-VhHvg?hl=en"]]},

{id:"altar", addr:"Bazylika Mariacka, plac Mariacki 5, 31-042 Kraków", day:"d1", seg:0, ord:9, tag:"all", svg:"altar",
 title:"The Veit Stoss altarpiece", sub:"Twelve years of carving, then branded as a criminal", era:"1477–1489",
 story:[
 "A German sculptor spent twelve years carving the largest Gothic altarpiece in the world, then went home and got branded on the face as a criminal. Veit Stoss ran a workshop in Nuremberg when the townspeople of Kraków offered him the commission in 1477. He brought his young family, set up a new workshop, hired sculptors and apprentices, and took the Polish version of his name, Wit Stwosz. He stayed twenty years, living on Grodzka Street.",
 "Back in Nuremberg in 1503 he forged a document trying to recover money lost to a fraudster. The court sentenced him to death, an emperor intervened, and the sentence became branding on both cheeks with hot irons. Barred from leaving the city, he tried to escape, was caught and imprisoned, and won a pardon in 1506. He died in 1533 during a plague, probably blind by then.",
 "In 1941 the Governor-General of occupied Poland ordered the altarpiece dismantled and shipped to Germany. The justification rested on the sculptor's German birth, which let the occupiers claim a Polish national treasure as German property despite five centuries in this church. Polish prisoners held at Nuremberg Castle got word to the resistance that it was hidden there, and a Polish officer found it in 1946 in the basement of the bombed castle. It came home and returned to this church in 1957."],
 why:"Ownership of a carving became an argument about who a country belongs to. Note also that the townspeople paid for it, not the king, which tells you how rich this city was in the 1470s.",
 look:["It stands 13 metres high and 11 wide, holds over 200 figures, and takes the form of five panels. The largest figures reach 2.7 metres, and each one was carved from a single tree trunk. Most is limewood, the decoration oak, the background fine larch.",
 "Look at the faces rather than the gold. They are individual rather than idealised, with real jaws, real hands and visible age. Matejko, who painted this morning's canvas, also decorated this church's interior between 1890 and 1891, so the walls around the altarpiece come from the same hand as the Prussian Homage."],
 guesses:[
 {q:"How many years did the carving take?", a:"Twelve, from 1477 to 1489.", src:"here"},
 {q:"Each of the largest figures was carved from a single tree. Roughly how many trees?", a:"Dozens. The biggest figures alone stand 2.7 metres, and every one needed a trunk that size.", src:"away"}],
 act:{type:"label", kind:"Diagram labelling", prompt:"None of these labels name their own position, so you will have to work each one out.",
  svg:"altar",
  pins:[{x:200,y:120,a:"Every large figure here was cut from a single tree"},
        {x:98,y:134,a:"Hinged, so the whole thing can be shut on a quiet day"},
        {x:200,y:26,a:"About the length of a double-decker bus"},
        {x:356,y:140,a:"About as tall as a four-storey house"}],
  note:"A pentaptych: five panels, hinged so the wings close. The opening of the wings is a daily ceremony worth timing your visit around."},
 verdict:{answer:"As old as it looks", note:"Genuinely finished in 1489, and one of the few things on this trip that is exactly what it claims. The wrinkle is that it spent 1941 to 1957 somewhere else entirely."},
 practical:"The wings are opened ceremonially once a day and that is the thing to catch. Check the current time at the door, since it shifts. Visitors enter through a separate side entrance from worshippers and pay a small fee.",
 links:[["Daily Art Magazine: the fraud and the branding","https://www.dailyartmagazine.com/veit-stoss-altarpiece/"]],
 kids:{who:"all", do:"I spy, whispered: a baby, a beard, a red cloak, something gold. Four things to find in one carving.", find:"A gold star.", how:"Inside St Mary's, at the far end, behind the altar: an enormous carved and painted wooden screen, gold, covered in life-sized figures. You enter through a side door and pay a small fee. It is dark, so let eyes adjust. Turn the hunt into a whisper game because it is a working church: find a baby, find a beard, find a red cloak, find something gold. All four are there. The star is up in the top section. Ten minutes, quiet voices."},
 sources:[["Wikipedia: the altarpiece","https://en.wikipedia.org/wiki/Veit_Stoss_altarpiece_in_Krak%C3%B3w"],["Independent Catholic News: the wartime recovery","https://www.indcatholicnews.com/news/30988"]]},

{id:"skrzynecki", addr:"Pomnik Piotra Skrzyneckiego, Rynek Główny 29, 31-010 Kraków", day:"d1", seg:0, ord:6, tag:"all", svg:null,
 title:"Skrzynecki's bronze table", sub:"Joking under surveillance", era:"1956–1997",
 story:[
 "Piotr Skrzynecki spent forty years running a cabaret that mocked the Polish communist state from a cellar fifty metres from here. He founded it in 1956, months after Stalin's death loosened the grip, and gathered poets and singers who took apart the absurdities of the system through satire. The cabaret outlasted the regime and still performs.",
 "The secret police watched constantly. Historians have since written a whole book from the surveillance files.",
 "Skrzynecki compèred until his death in 1997, always in hat and suit, always carrying fresh flowers, notorious for his birthday parties. The bronze sits at his own small table outside Vis à Vis, a spot the living man favoured, and someone replaces the flowers in his hand every day."],
 why:"A state can ban a newspaper. Banning a joke told in a cellar to two hundred people turns out to be much harder, and the cellar outlived the state.",
 look:["Sit down next to him. Check whether today's flowers are fresh, because somebody replaces them daily and has done since 2000.",
 "Security police closed the cellar in 1961 citing breaches of fire regulations, because a state that could not admit to censoring found other paperwork instead. For years the performers were banned from appearing anywhere in Poland outside Kraków. They played Paris regardless."],
 guesses:[
 {q:"In what year did the cabaret open in the cellar behind you?", a:"1956, months after Stalin's death loosened the grip.", src:"here"},
 {q:"The performers were banned from appearing anywhere in Poland outside Kraków. For how many years?", a:"Ten, from 1964. They played Paris during the ban, which the authorities could do nothing about.", src:"away"}],
 act:{type:"mcq", kind:"Multiple choice",
  prompt:"The authorities shut the cabaret in 1961. What reason did the paperwork give?",
  opts:["Insulting the Party","Breaches of fire regulations","Unpaid taxes","Performing without a licence"],
  answer:1, note:"Fire regulations. The state could not admit that censorship existed, so it reached for other paperwork. A censor elsewhere once struck the word 'censorship' from a script on the grounds that censorship did not exist and the constitution guaranteed free speech."},
 verdict:{answer:"Older than it looks", note:"The statue went up in 2000. The cellar behind it has run since 1956, and the building held a tavern in the 1400s where the great writers of the Polish Renaissance drank."},
 links:[["Piwnica pod Baranami","https://piwnicapodbaranami.pl/muzyka"]],
 kids:{who:"all", do:"Sit down next to him at his little table. Check whether today's flowers are fresh.", find:"His hat.", how:"A life-sized bronze man sitting at a small round bronze table, on the edge of the Main Square outside a café called Vis à Vis. There is an empty chair, so children can sit down next to him. He wears a wide-brimmed hat and has a beard. Somebody puts real flowers in his bronze hand every day, so the hunt is to check whether today's are fresh or drooping. Good photo, takes two minutes."},
 sources:[["Nasza Historia: the security services","https://naszahistoria.pl/67-lat-temu-otwarto-piwnice-pod-baranami-artysci-jawnie-kpili-z-wladz-komunistycznej-polski-jak-sluzby-na-to-reagowaly/ar/c1-17577729"],["Kraków Heritage","https://krakowheritage.com/en/intangible-heritage/gastronomy/cafes/"]]},

{id:"obwarzanek", addr:"Rynek Główny, 31-042 Kraków (carts on every corner)", day:"d1", seg:0, ord:7, tag:"food", svg:"obwarzanek",
 title:"The obwarzanek cart", sub:"Sold here since 1394, protected by law since 2010", era:"1394 onwards",
 story:[
 "On 2 March 1394 a clerk keeping the royal court accounts wrote down a payment: for the Queen, for rings, one grosz. That is the same bread, in the same city, 632 years ago.",
 "The name comes from a verb meaning to parboil. The dough is boiled before baking, which gives the chewy inside and the glossy crust.",
 "In 1496 the king gave Kraków's bakers a monopoly on white bread including these, confirmed by every Polish king for the next two centuries. At first they could only be baked during Lent, by bakers specially designated for the job."],
 why:"Kraków has been eating this since before Poland had a permanent capital, and defending it for nearly as long. A royal monopoly in 1496, confirmed by king after king, then a European protected status in 2010 that fixes the size, the method and who may legally bake one. Almost nothing else you will meet this weekend is simultaneously medieval, edible and still sold on a street corner for small change.",
 look:["Look at the side of the ring. Two strands twisted together give a visible braid, and that is the quickest way to tell a real one from a bagel, which is a single untwisted rope.",
 "Turn it over. A genuine one carries lengthwise marks on the base from the baking tray. Size is fixed by an EU certificate that only bakers in Kraków and two neighbouring districts may use."],
 guesses:[
 {q:"In what year does the first written record of the obwarzanek appear?", a:"1394, in the royal accounts: one grosz, for rings, for the queen.", src:"here"},
 {q:"How wide may a legal obwarzanek be?", a:"Twelve to seventeen centimetres across, and two to four thick. The European certificate fixes it.", src:"away"}],
 act:{type:"sort", kind:"Categorise", prompt:"Tap each item, then say whether it describes the obwarzanek or the bagel.",
  buckets:["Obwarzanek","Bagel"],
  opts:[{l:"Two strands twisted together",b:0},{l:"A single untwisted rope",b:1},
        {l:"Boiled before baking",b:0},{l:"Also boiled before baking",b:1},
        {l:"Protected by EU law since 2010",b:0},{l:"Marks on the base from the tray",b:0}],
  note:"Both are boiled, which is the trap. The braid is the real difference, and only one of them has a legal specification."},
 verdict:{answer:"Older than it looks", note:"A street snack with a legal specification and a paper trail to 1394."},
 links:[["The official EU product specification","https://assets.publishing.service.gov.uk/media/6772c4bd2554737c528474f2/Product_specification_Obwarzanek_krakowski_wniosek_EN.docx.pdf"]],
 kids:{who:"all", do:"Count the twists in the braid before eating it. Then eat it.", find:"A blue cart. They are all over the square.", how:"The blue-and-glass carts on wheels, parked on nearly every corner around the Main Square, selling rings of bread from a stack. Buy one each. Before eating, hold it up and look at the side: two ropes of dough twisted round each other, so you can count the twists as they spiral round. Ten to fourteen usually. Ask for one with poppy seeds or salt. Costs a few złoty."},
 sources:[["Living Obwarzanek Museum","https://www.muzeumobwarzanka.com/historia-obwarzanka/?lang=en"],["Wikipedia","https://en.wikipedia.org/wiki/Obwarzanek_krakowski"]]},

{id:"sukiennice", addr:"Galeria Sztuki Polskiej XIX w. w Sukiennicach, Rynek Główny 3, 31-042 Kraków", day:"d1", seg:1, tag:"split", svg:"sukiennice",
 title:"Sukiennice Gallery", sub:"Building a nation without a country", era:"1879",
 story:[
 "Poland vanished from the map in 1795, carved up by Russia, Prussia and Austria, and stayed gone for 123 years. Kraków fell into the Austrian share, which turned out lucky, because Vienna permitted Polish schools, theatre and publishing that Berlin and St Petersburg crushed. Kraków became the place where Poles kept the nation alive as a culture while lacking one as a state.",
 "In 1879 the city threw a party here for a much-loved novelist. Mid-ceremony the painter Henryk Siemiradzki stood up and handed his vast canvas to the public. That gift seeded a collection, and the council voted on 7 October the same year to found Poland's first national museum.",
 "Poles who could not build an army built institutions instead: a museum, a gallery, a canon of paintings that told them who they had been."],
 why:"Walk the four rooms in order and you watch a country die, then watch its painters argue for a century about who counts as Polish. Kings, then soldiers, then peasants and Jews, then a scandalous nude with nothing to do with the nation at all.",
 look:["The first painting you meet shows Poland's last king in his coronation robes. He signed the country away, and everything after hangs in the shadow of that failure.",
 "In the Romanticism room, find the cavalry charge at Somosierra, where Polish horsemen fighting for Napoleon took an artillery pass at a gallop. The same room hangs portraits of Jewish neighbours, peasants and children, which marks the moment 'the nation' stopped meaning the nobility.",
 "The last room holds the picture everybody remembers: a naked woman clinging to a rearing black horse. Twelve thousand people queued for it in Warsaw in 1894, and on the thirty-sixth morning the painter walked in, asked for a ladder, and slashed his own canvas in front of the visitors. Worth flagging the nudity before anyone turns the corner."],
 guesses:[
 {q:"How many years was Poland absent from the map of Europe?", a:"One hundred and twenty-three, from 1795 to 1918.", src:"here"},
 {q:"How old was the painter who slashed his own canvas when he died?", a:"Twenty-eight, of tuberculosis. Restorers repaired the painting after his death and it hangs here.", src:"away"}],
 act:{type:"order", kind:"Ordering", prompt:"The four rooms run in sequence. Tap them into the order you walk them.",
  opts:[{l:"Enlightenment: the last king, in coronation robes",v:1},{l:"Romanticism: a cavalry charge, and portraits of neighbours",v:2},
        {l:"History painting: the past used to argue about the present",v:3},{l:"Realism and the first impressionists: the scandalous nude",v:4}],
  note:"A country loses its state, then spends a century arguing about who belongs to it. By the last room the painters have stopped asking."},
 verdict:{answer:"Older than it looks", note:"The gallery dates from 1879, but the hall around it began as a 13th-century cloth market, went Gothic in the 1300s and Renaissance in the mid-1500s."},
 practical:"Tue to Sun, 10:00 to 18:00, closed Monday, last admission 20 minutes before closing. 35 PLN normal, 25 reduced, 70 family, and 1 PLN for ages 7 to 26. Lift to the gallery and terrace, no thresholds between halls, changing table in the accessible toilet. Ask at the desk whether the Prussian Homage is hanging before you promise anyone they will see it.",
 links:[["MNK Sukiennice","https://mnk.pl/en/branches/mnk-sukiennice/"]],
 kids:{who:"skip", do:"Not a stop for them. The younger group is at the obwarzanek workshop while this happens.", find:"Nothing here. They earn their scale at the workshop.", how:"Not for them. The gallery is upstairs, quiet, and full of large paintings including a nude. The younger group is at the obwarzanek workshop while this happens, so swap an adult over and meet afterwards at the Mickiewicz statue."},
 sources:[["MNK Sukiennice: official","https://mnk.pl/en/branches/mnk-sukiennice/"],["Museums.EU: the slashing","http://museums.eu/article/details/120982/scandal-in-warsaw-podkowiskis-frenzy-and-the-birth-of-young-poland"]]},

{id:"workshop", addr:"Żywe Muzeum Obwarzanka, ul. Podwale 6, 31-118 Kraków", day:"d1", seg:1, tag:"food", svg:"obwarzanek",
 title:"Living Obwarzanek Museum", sub:"Roll your own", era:"A medieval craft, a modern workshop",
 story:[
 "The children get to do with their hands what the adults are reading about in the gallery. Bakers here have twisted these rings since at least 1394, and the twist is the whole trick: two strands rolled together, joined into a circle, boiled, then baked.",
 "The braid separates the real thing from a bagel. A bagel is one rope. This is two, wound round each other, which is why a genuine one shows a spiral down its side."],
 why:"Kraków's bakers held a royal monopoly on this bread from 1496, defended it through four centuries of kings, and their successors went to the European Union in 2010 to defend it again. The city treats a cheap street snack as heritage worth legal protection, and the twist in the dough is the thing being protected.",
 look:["Compare your own with one bought from a cart. Whose braid is tighter, and can you see the spiral running down the side?",
 "Look at the base of the shop-bought one for the lengthwise marks left by the tray."],
 guesses:[
 {q:"In what year does the obwarzanek first appear in writing?", a:"1394. The technique in your hands has a paper trail older than most European nations.", src:"here"},
 {q:"Count the carts you passed on the way here. Closest guess picks the topping.", a:"Whatever you counted. Kraków has hundreds of them, all selling the same protected ring.", src:"away"}],
 act:{type:"match", kind:"Matching", prompt:"Tap a step, then tap what it does.",
  pairs:[["Twisting two strands","Creates the braid you can see down the side"],
         ["Boiling before baking","Gives the glossy crust and chewy inside"],
         ["The tray","Leaves lengthwise marks on the base"],
         ["The EU certificate","Fixes the size and bans outside bakers from the name"]],
  note:"Four steps, four consequences. Every one of them is visible on the thing in your hand."},
 verdict:{answer:"Older than it looks", note:"A children's craft workshop, teaching a technique with a paper trail back to 1394."},
 links:[["Living Obwarzanek Museum","https://www.muzeumobwarzanka.com/historia-obwarzanka/?lang=en"]],
 kids:{who:"all", do:"Roll and braid their own obwarzanek, then compare it with one bought from a cart.", find:"Their own finished ring, coming out of the oven.", how:"An indoor workshop where each child gets dough and is shown how to roll two ropes, twist them together and join them into a ring. Staff do the boiling and baking. Book ahead, because sessions run to a timetable and fill up. Allow about an hour. They keep what they make, which becomes the hunt: spotting their own coming out of the oven."},
 sources:[["Living Obwarzanek Museum","https://www.muzeumobwarzanka.com/historia-obwarzanka/?lang=en"]]},

{id:"noworolski", addr:"Kawiarnia Noworolski, Rynek Główny 1/3, 31-042 Kraków", day:"d1", seg:1, tag:"food", svg:null,
 title:"Café Noworolski", sub:"One family, two confiscations", era:"1912 onwards",
 story:[
 "Four generations of one family have run this café, losing it twice to two different dictatorships. Jan Noworolski trained as a pastry chef in Lwów, did a stint at Sacher in Vienna, bought this failing shop in 1910 and reopened it in 1912 as a Viennese-style café under his own name.",
 "German occupiers seized it in 1940 and ran it as a bar marked 'Germans only'. He recovered it in 1945 and saved the fittings from looting. Three years later the communist security police threw him out during a national campaign against private business. The paperwork claimed the square held too many similar cafés. The real motive was a demonstration of who now held power.",
 "Aged seventy-seven, he never entered the room again, and died of a brain haemorrhage the following year. His son recovered the café in 1992. A great-grandson runs it today."],
 why:"Lenin read the papers here. Then the Nazi elite drank here. Then the communists took the keys. One room, four regimes, and the same family name over the door at the end of it.",
 look:["Ask for the White Room, which keeps its original 1912 fittings: cream panelling with little columns, mirrors, narrow sofas in red plush.",
 "Look up for the painted birds resembling peacocks, each holding a gold ring in its beak. One room banned smoking from the start, which is why locals called it the ladies' boudoir."],
 guesses:[
 {q:"How many regimes have held the keys to this room?", a:"Four: Austrian Galicia, independent Poland, the German occupation, then the communists.", src:"here"},
 {q:"The communists seized it in 1948. How many years before the family got it back?", a:"Forty-four. The son recovered it in 1992, and a great-grandson runs it now.", src:"away"}],
 act:{type:"timeline", kind:"Timeline", prompt:"Tap these into order, earliest first.",
  opts:[{l:"A pastry chef from Lwów buys the shop",v:1910},{l:"German occupiers seize it, 'Germans only'",v:1940},
        {l:"Recovered, and the fittings saved from looting",v:1945},{l:"Communist security police evict the founder",v:1948},
        {l:"The family gets it back",v:1992}],
  note:"1910, 1940, 1945, 1948, 1992. Eighty-two years from buying it to holding it securely."},
 verdict:{answer:"As old as it looks", note:"Genuinely 1912, and one room still carries its original fittings."},
 links:[["Noworolski: the family's own history","http://www.noworolski.com.pl/page/index.html"]],
 kids:{who:"all", do:"Order a hot chocolate and rate it out of five. Serious business, requires discussion.", find:"A painted bird with a gold ring in its beak. Look up.", how:"An old café inside the Cloth Hall, the long yellow building in the middle of the Main Square. Grand, mirrored, quite formal, so it suits sitting down rather than running. Order hot chocolate and have them mark it out of five. For the hunt, look UP at the painted ceiling and walls for birds that look like peacocks, each holding a gold ring in its beak."},
 sources:[["Kraków Travel","https://krakow.travel/39919-krakow-kawiarnia-noworolski"],["Małopolska Institute of Culture","https://dnidziedzictwa.pl/kawiarnia-noworolski-w-krakowie/"]]},

{id:"franciscan", addr:"Bazylika św. Franciszka z Asyżu, plac Wszystkich Świętych 5, 31-004 Kraków", day:"d1", seg:1, tag:"all", svg:null,
 title:"Franciscan Church", sub:"The artist who painted flowers instead of saints", era:"1897–1904",
 story:[
 "Stanisław Wyspiański won a commission to decorate this Gothic church in the 1890s and horrified the friars who hired him. Churches then expected gold, saints and solemnity. He covered the walls with plants: stylised flowers, geometric patterns, motifs lifted from Polish folk embroidery. The friars objected that the scheme looked too plain and too strange for a church.",
 "He argued back that Francis of Assisi had loved created things above all, so flowers belonged on the walls better than gilding did.",
 "He won the argument, kept the murals, and then received the far larger commission for the windows. He designed the great window over the west end in 1902 and the glaziers finished it in 1904. It shows God making the world, holding the four elements: fire, water, air and earth."],
 why:"Poles now rate this the finest Art Nouveau glass in the country, and the friars who nearly cancelled the whole thing sit in the middle of it.",
 look:["Turn round at the far end and look back over the entrance. The window stands 8.46 metres tall. The interior is very dark, which makes the glass carry the whole room, so give your eyes a minute before judging.",
 "Scan the walls for plants rather than saints. The flowers come from ordinary Polish gardens. The friary dates from 1269 and housed the first Franciscans in Poland, and Karol Wojtyła prayed here privately in the years before he became Pope John Paul II."],
 guesses:[
 {q:"How tall is the great window over the entrance?", a:"8.46 metres, and it fills the whole west wall.", src:"here"},
 {q:"How many separate kinds of flower can you pick out on the walls?", a:"Count what you can find. They are ordinary Polish garden plants, which was the entire scandal.", src:"away"}],
 act:{type:"match", kind:"Matching", prompt:"Tap an objection, then tap Wyspiański's answer to it.",
  pairs:[["Too plain for a church","Francis loved created things more than gold"],
         ["Flowers are not sacred subjects","He preached to birds and called the sun his brother"],
         ["Folk embroidery belongs on a peasant's shirt","So does the faith of the people in the pews"],
         ["Where are the saints?","Look up at the window instead"]],
  note:"He won every round, kept the murals, and then got the far bigger commission for the glass."},
 verdict:{answer:"Older than it looks", note:"A 13th-century Gothic church wearing a 1900s interior that scandalised its own owners."},
 links:[["MNK Wyspiański","https://mnk.pl/en/wystawy/mnk-the-wyspianski/"]],
 kids:{who:"all", do:"Tick off every colour they can find in the big window. It is very dark, so give their eyes a minute.", find:"The colour blue in the glass.", how:"A dark Gothic church a few minutes south-west of the Main Square. Walk in, go to the far end, then TURN ROUND and look back above the door: an enormous stained glass window fills the wall. It is very dark inside, so stand still for a minute and let eyes adjust before asking anything. Then tick off the colours they can find. Blue is there but takes hunting. The walls are painted with flowers rather than saints, which is worth pointing out. Free, and quiet."},
 sources:[["Guide-Cracow: the commission and the row","https://www.guide-cracow.com/cracow/cracow-franciscan-church-art-nouveau-wyspianski.php"],["Wikipedia: God the Father, Arise","https://en.wikipedia.org/wiki/God_the_Father_-_Arise"]]},

{id:"conrad", addr:"ul. Poselska 12, 31-002 Kraków", day:"d1", seg:1, tag:"all", svg:null,
 title:"Poselska 12", sub:"The boy who became Joseph Conrad", era:"1869",
 story:[
 "An eleven-year-old walked behind his father's coffin through these streets, and grew up to write Heart of Darkness in his third language.",
 "Apollo Korzeniowski, Joseph Conrad's father, brought his sick son to Kraków on 20 February 1869 and died of tuberculosis three months later, leaving the boy an orphan. Conrad's mother had already died of the same disease during the family's exile. Russian authorities had earlier sentenced the father to internal exile over a thousand miles away for organising a secret Polish independence committee, and marched the whole family there under armed guard.",
 "The Kraków funeral turned into a mass patriotic demonstration, with writers, intellectuals and ordinary citizens filling the procession. His parents had christened him after his two grandfathers, then called him Konrad instead, borrowing the name from the hero of two poems by Adam Mickiewicz, whose statue you stood at this morning."],
 why:"His parents named him for a resistance hero. He grew up to write in English, and Poles have argued ever since about whether that counts as desertion.",
 look:["The plaque sits on the wing of the city offices facing the street. It records that the son of a wandering poet spent his youth in a house that once stood here, which means the building itself has gone.",
 "The English text on it is Conrad's own: the old royal and academic city was where he stopped being a child. He was eleven when he arrived."],
 guesses:[
 {q:"How old was Conrad when his father died and left him an orphan?", a:"Eleven, three months after the two of them arrived in Kraków.", src:"here"},
 {q:"How old was he when he left Kraków for good?", a:"Sixteen, in 1874. He went to sea, and wrote his novels in a language he had not yet learned.", src:"away"}],
 act:{type:"order", kind:"Ordering", prompt:"Tap these into order, earliest first.",
  opts:[{l:"His father organises a secret independence committee",v:1},{l:"The family is marched into exile under guard",v:2},
        {l:"His mother dies of tuberculosis in exile",v:3},{l:"Father and son arrive in Kraków",v:4},
        {l:"The funeral becomes a patriotic demonstration",v:5},{l:"Conrad leaves Kraków for good",v:6}],
  note:"Six steps from a political meeting in Warsaw to an orphan on a ship. He was sixteen at the end of it."},
 verdict:{answer:"As old as it looks", note:"A modest plaque on an office wall, and the house it describes no longer exists."},
 links:[["Conrad Festival: in his footsteps","https://en.conradfestival.pl/p/81,in-the-footsteps-of-conrad-conrad-year"]],
 kids:{who:"all", do:"Find the plaque on the wall. That is the whole task, and it takes thirty seconds.", find:"The name Conrad, hiding in the Polish text.", how:"A small plaque on the wall of the city offices on Poselska, a narrow quiet street. Thirty seconds. The task is simply to spot it, then find the name Conrad in the Polish text. Good one to give a child who wants a job while the adults read."},
 sources:[["Conrad Festival","https://en.conradfestival.pl/p/81,in-the-footsteps-of-conrad-conrad-year"],["Duke University: Conrad exhibition","https://exhibits.library.duke.edu/exhibits/show/josephconrad/borderlands"]]},

{id:"wanda", addr:"Kopiec Wandy, ul. Ujastek Mogilski, 31-752 Kraków", day:"d2", seg:0, ord:1, tag:"all", svg:"mound",
 title:"Wanda Mound", sub:"Nobody knows who built it", era:"600s? 700s? Nobody can say",
 story:[
 "A grass hill sits beside Europe's ugliest steelworks, and nobody knows who built it or why.",
 "Legend hands the mound to Wanda, daughter of the prince who supposedly founded Kraków. A German knight demanded her hand. She refused, and rather than expose her people to the invasion that would follow, she threw herself into the Vistula. The river carried her body downstream, and villagers here recovered it. People raised the mound over the spot where the river gave her back.",
 "Archaeology declines to confirm any of that. Nobody has ever excavated the mound properly, and digs at its sister mound across the city turned up no human remains at all. Written records mention the hill from 1222, when a bishop gave the surrounding village to monks and described the land as lying beside the mound. Those earliest documents say nothing whatever about Wanda."],
 why:"Poles have spent eight hundred years telling stories about a lump of earth precisely because the truth stays out of reach. The oldest visible human work in this part of Kraków sits next to the newest, and neither one means what its builders intended.",
 look:["A monument crowns the summit: an eagle with folded wings facing west, put up in 1890 and designed by the painter behind yesterday's Prussian Homage. Look for the word Wanda, two swords and a distaff carved into the plinth.",
 "Diggers have sampled only the top 30 centimetres of soil, so what fills the inside remains unknown. Enthusiasts claim the mound aligns with its sister across the city so the sun rises over one and sets over the other on old Celtic festival dates. Treat that as a lovely idea rather than a proven fact."],
 guesses:[
 {q:"How much of this mound has ever been excavated?", a:"The top thirty centimetres. What fills the inside is still unknown.", src:"here"},
 {q:"How high is it?", a:"Roughly fourteen metres, raised by hand, by people nobody can identify, for reasons nobody can establish.", src:"away"}],
 act:{type:"sort", kind:"Categorise", prompt:"Tap each statement, then decide whether archaeology supports it or not.",
  buckets:["Evidence for it","Story only"],
  opts:[{l:"A mound stood here by 1222",b:0},{l:"Wanda drowned herself in the Vistula",b:1},
        {l:"Nobody has found human remains",b:0},{l:"Villagers recovered her body here",b:1},
        {l:"The top 30cm has been sampled",b:0},{l:"It aligns with its sister mound at solstice",b:1}],
  note:"Three facts, three stories. Poles have known the difference for eight hundred years and told the stories anyway."},
 verdict:{answer:"Older than it looks", note:"And nobody can say how much older. The honest answer is the interesting one."},
 links:[["Archaeological Museum of Kraków","https://ma.krakow.pl/1-2/"]],
 kids:{who:"all", do:"Climb up. Roll down. Repeat until an adult stops it.", find:"The eagle standing on top.", how:"A large grass hill in the middle of Nowa Huta, with a path spiralling up. The climb takes a few minutes and is fine for small legs. At the top there is a stone block with a bronze eagle on it, wings folded. Rolling down the side is the point of the whole stop. Grass may be damp, so bring a change of clothes or accept the consequences."},
 sources:[["City of Kraków: Wanda Mound","https://www.krakow.pl/instcbi/1302,inst,11061,821,instcbi.html"],["Niezwykła Małopolska","https://niezwyklamalopolska.pl/kopiec-wandy/"]]},

{id:"milkbar", addr:"Bar mleczny, os. Centrum, Plac Centralny, 31-931 Kraków", day:"d2", seg:1, tag:"food", svg:"tray",
 title:"The milk bar", sub:"Kraków invented it, as propaganda", era:"1948 onwards",
 story:[
 "Poland's first milk bar opened on the Main Market Square on 30 May 1948. Nobody could buy a hot meal there. Customers came to drink milk, served in a quarter-litre glass with a straw, part of a government campaign to shift the nation from moonshine to dairy while a milk surplus sat unsold.",
 "Meat carried a ration card and a price, so the early menus ran on eggs, cheese and flour. The state then nationalised the restaurants and opened milk bars in their place, and some workers received their lunches as part of their wages.",
 "Subsidies kept prices absurd, which turned the milk bar into a lifeline for pensioners and the unemployed, and keeps it one today. A government attempt to withdraw the subsidy in 2011 produced public protest, and the money stayed."],
 why:"Poland kept this after 1989 when it demolished most of what communism left behind, and kept it deliberately. Milk bars feed pensioners, students and people out of work at prices nobody else offers, which is why an attempt to end the subsidy in 2011 ran into public protest and failed. A country that spent forty years resenting state provision decided this particular piece of it was worth paying for, and the milk bar has outlived the system that scaled it up.",
 look:["Take a tray, walk the counter, point, pay at the till, find a seat. No table service, mismatched plates, and the menu on the board above the counter. Brief the children before you go in, because the queue moves fast.",
 "Order kompot, a lightly sweetened drink of cooked fruit, which comes as standard. The children can collect the flavours across three days. Soup, a main and a drink runs roughly 25 to 40 PLN."],
 guesses:[
 {q:"In what year did the first milk bar open anywhere in Poland?", a:"1896, in Warsaw, opened by a dairy farmer. Half a century before communism.", src:"here"},
 {q:"Guess the total bill for the whole group before you order, then check the till.", a:"Soup, a main and a drink runs roughly 25 to 40 złoty a head, which is about five to eight pounds.", src:"away"}],
 act:{type:"sort", kind:"Categorise", prompt:"Tap each item, then decide whether communism invented it or inherited it.",
  buckets:["Invented by the state","Older than the state"],
  opts:[{l:"The milk bar format",b:1},{l:"Subsidised prices for everyone",b:0},
        {l:"Kompot as the default drink",b:1},{l:"Lunches paid as part of wages",b:0},
        {l:"Milk served with a straw to fight moonshine",b:0}],
  note:"The thing that looks most Soviet in the room, the format itself, dates from 1896 and the partitions."},
 verdict:{answer:"Older than it looks", note:"Looks communist. Invented under the Tsars by a dairy farmer with too much milk."},
 links:[["Alimentarium: why they survive","https://www.alimentarium.org/en/story/bary-mleczne"]],
 kids:{who:"all", do:"Carry their own tray along the counter and point at what they want. Then rate the kompot out of five.", find:"The menu board above the counter.", how:"A canteen, not a restaurant. There is a counter with a lit board above it listing dishes in Polish. Take a tray from the stack, walk along, point at what you want, pay at the till at the end, then find your own table. Let the children carry their own trays. Kompot is the pinkish fruit drink, poured from a jug: have them mark it out of five. The board is the hunt — ask them to find the price of the cheapest thing on it."},
 sources:[["In Your Pocket: Kraków milk bars","https://www.inyourpocket.com/krakow/krakow-milk-bars_73733f"],["Wikipedia: bar mleczny","https://en.wikipedia.org/wiki/Bar_mleczny"]]},

{id:"plac", addr:"Plac Centralny im. Ronalda Reagana, 31-931 Kraków", day:"d2", seg:1, tag:"all", svg:"plac",
 title:"Plac Centralny", sub:"A city built to cancel a city", era:"1949–1956",
 story:[
 "Poland's communist government looked at Kraków, saw a place stuffed with priests, professors and aristocrats, and decided to build a rival.",
 "Work began in 1949 on the site of two medieval villages. The plan centred on a vast steelworks, a gift from the Soviet Union, surrounded by housing for the workers who would run it. Planners intended a workers' paradise, a laboratory for socialism, and assumed the residents would grow up atheist. Only one other fully planned socialist realist city exists anywhere, in the Russian Urals.",
 "Designers laid the streets in a sunburst radiating from this square, built for a hundred thousand people, and dressed the whole thing in a style borrowing Renaissance elegance and stretching it to Soviet scale."],
 why:"The plan failed in the way that matters. Nowa Huta became a stronghold of the independent trade union movement that helped bring the system down. A government spent a fortune manufacturing a loyal working class, and manufactured its own opposition instead.",
 look:["Look at the ground-floor arcades running round the square, the deliberate touch of Renaissance decoration softening the authority above. Then look at the scale of what sits on top of them.",
 "The avenues are cut wide to stop fires spreading, and planners claimed the avenue trees would absorb the blast from a nuclear weapon. Tunnels and bunkers run beneath, sized to shelter the whole population, and the street grid lets the district convert into a fortress. The pavements are also far smoother than the Old Town cobbles, which matters if you have a pram."],
 guesses:[
 {q:"How many residents was Nowa Huta designed to hold?", a:"One hundred thousand. It now holds well over twice that.", src:"here"},
 {q:"How many other fully planned socialist realist cities exist anywhere in the world?", a:"One, in the Russian Urals. This is one of only two ever completed.", src:"away"}],
 act:{type:"mcq", kind:"Multiple choice",
  prompt:"Nowa Huta was built to dilute Catholic, intellectual Kraków with loyal steelworkers. What happened?",
  opts:["It worked, and the district stayed loyal","It became a stronghold of the opposition that helped end the system",
        "The steelworks was never finished","The population refused to move in"],
  answer:1, note:"It backfired completely. The workers built a church by hand, went on strike, and the square is now named after an American president."},
 verdict:{answer:"A fake", note:"Renaissance arcades poured in the 1950s, on a plan that doubles as a fortress."},
 links:[["Atlas Obscura: Nowa Huta","https://atlasobscura.com/places/nowa-huta"]],
 kids:{who:"all", do:"Count the arches running round the square. Split the sides between them so nobody has to count past twenty.", find:"A star shape somewhere on a building.", how:"An enormous open square in Nowa Huta with matching stone buildings all round it. Along the ground floor of each runs a covered walkway held up by arches. Give each child one side of the square to count so nobody has to count past twenty, then add them up. For the star, look up at the tops of the buildings and the decoration: there are red communist stars worked into the stonework in places."},
 sources:[["Britannica: Nowa Huta","https://www.britannica.com/place/Nowa-Huta"],["In Your Pocket","https://www.inyourpocket.com/poland/krakow/articles/nowa-huta-krakows-socialist-realism-suburb"]]},

{id:"arka", addr:"Arka Pana, ul. Obrońców Krzyża 1, 31-831 Kraków", day:"d2", seg:1, tag:"all", svg:"arka",
 title:"Arka Pana", sub:"Two million stones", era:"1960–1977",
 story:[
 "Residents of the atheist city spent twenty years fighting for a church, and won by hand.",
 "People raised money and planted a wooden cross in 1957 on the plot promised for a church. Authorities then reassigned the plot to a school and ordered the cross removed. Workers arrived on the morning of 27 April 1960 to take it down, and passers-by stopped them. A crowd gathered through the day. Militia came with truncheons and tear gas, protesters answered with stones, and a pitched battle ran until nightfall. The party leader afterwards called the defenders scum and troublemakers, and police drew up a list of more than two hundred people to jail, fine or sack. The cross stayed up.",
 "Permission arrived in 1965, for a different site. Then the authorities supplied nothing, no materials and no equipment, inside an economy where the state controlled all supply. So residents mixed their own cement, made their own bricks, and collected roughly two million polished stones from Poland's rivers to face the walls. Ten years of volunteer labour finished the job."],
 why:"The local archbishop who forced the permit through, said Mass in the freezing open field and consecrated the finished church in 1977 became Pope John Paul II a year later. Nowa Huta made him.",
 look:["Put your hand on the wall. Two million river stones cover the exterior, and every one arrived in somebody's pocket or bag.",
 "The building takes the shape of an ark, a vessel carrying people out of a ruined world, and the timber lining inside suggests the hull of a boat. The cornerstone came from Rome, a fragment given by the pope of the day and taken from the basilica over St Peter's tomb. The street outside carries the name Defenders of the Cross."],
 guesses:[
 {q:"How many river stones cover the outside of this church?", a:"Roughly two million, every one carried here by hand because the state supplied nothing.", src:"here"},
 {q:"Builders found a wartime ammunition dump under the site. How many mines and shells came out?", a:"Around five thousand, cleared before work could even begin.", src:"away"}],
 act:{type:"timeline", kind:"Timeline", prompt:"Tap these into order, earliest first.",
  opts:[{l:"A wooden cross planted on the promised plot",v:1957},{l:"Militia and crowds fight all day over the cross",v:1960},
        {l:"Permission granted, for a different site",v:1965},{l:"The finished church consecrated",v:1977},
        {l:"The archbishop who consecrated it becomes pope",v:1978}],
  note:"1957, 1960, 1965, 1977, 1978. Twenty years of refusal, then the man who forced it through went to Rome."},
 verdict:{answer:"As old as it looks", note:"1977, the newest building on the trip, and the hardest won."},
 links:[["Atlas Obscura: building without supplies","https://www.atlasobscura.com/places/lords-ark"]],
 kids:{who:"all", do:"Put both hands flat on the wall and hunt for the smoothest stone in reach.", find:"The boat shape. Step back far enough to see the whole church at once.", how:"A large modern church shaped like an upturned boat, in Nowa Huta. The outside walls are covered in small smooth river stones, all different. Let them put both hands flat on the wall and hunt for the smoothest one they can reach. To see the boat shape they need to walk back thirty metres and look at the whole roof. Inside is dark and lined with timber like a hull."},
 sources:[["VisitMałopolska","https://visitmalopolska.pl/obiekt/-/poi/kosciol-matki-bozej-krolowej-polski-arka-pana-w-krakowie"],["In Your Pocket","https://www.inyourpocket.com/krakow/the-lords-ark_55453v"]]},

{id:"lem", addr:"Ogród Doświadczeń im. Stanisława Lema, al. Pokoju 68, 31-564 Kraków", day:"d2", seg:1, tag:"all", svg:"lem",
 title:"Lem's Garden of Experiments", sub:"The man who imagined his way out", era:"Post-war onwards",
 story:[
 "Stanisław Lem wrote about thinking oceans and philosophical robots, and did so because reality had already proved unbearable.",
 "Born in 1921 in Lwów, a Polish city now inside Ukraine, Lem came from a Jewish family who avoided the ghetto by living on forged papers. Most of his relatives died in the Holocaust. He survived the occupation working as a car mechanic and welder under a false name. Soviet annexation of his home city then pushed the family west, and Lem arrived in Kraków to resume medical studies at the university you visited on the first day.",
 "He deliberately failed his final exam, partly to dodge conscription as an army doctor, partly because passing required him to give answers matching official Soviet biology. He then spent fifty years writing science fiction in a country where the censors read everything, and got away with it, because a story set on another planet says nothing a censor can point at."],
 why:"Lem is the most translated Polish writer who has ever lived, and he did it from inside a censored state, which is why Poles treat him as more than a novelist. Writing about distant planets let him publish arguments about power, bureaucracy and truth that would have been cut from a realist novel. His readers understood exactly what the robots and the thinking oceans were standing in for, and so, probably, did the censors, who could do nothing about it. The garden bearing his name teaches physics to children in the district built by the same government he was writing around.",
 look:["Everything here is outdoors and hands-on, so the season runs April to October. Find the whisper dish, the see-saw and the sand planet. A hedge maze carries quotations from Lem, and separate areas cover rocks and smells.",
 "Let the small children run. This is the one stop on the whole trip designed to be touched rather than looked at."],
 guesses:[
 {q:"In what year did Lem publish the book describing virtual reality, artificial intelligence and nanotechnology?", a:"1964, from a flat in a city where the censors read everything.", src:"here"},
 {q:"Count how many of the exhibits here the children try before they stop. Guess first.", a:"Whatever it turns out to be. Everything is outdoors and meant to be handled.", src:"away"}],
 act:{type:"sort", kind:"Categorise", prompt:"Tap each item, then decide whether Lem described it decades early or not.",
  buckets:["Lem predicted it","Not his"],
  opts:[{l:"The internet",b:0},{l:"Ebooks and search engines",b:0},
        {l:"Virtual reality",b:0},{l:"The telephone",b:1},
        {l:"Nanotechnology",b:0},{l:"The printing press",b:1}],
  note:"Four out of six, and the two he missed had already been invented. He was writing this in the 1950s and 60s from a flat in Kraków."},
 verdict:{answer:"As old as it looks", note:"The newest thing on the trip, built to demonstrate the oldest laws."},
 links:[["Kraków Travel: the Garden of Experiments","https://krakow.travel/428-krakow-ogrod-doswiadczen-im-stanislawa-lema"]],
 kids:{who:"all", do:"Whisper into the dish and make somebody hear it from the other side. Then run everywhere else.", find:"The sand planet.", how:"An outdoor science park with metal and wooden equipment spread over grass. The whisper dish is a large curved dish on a stand: one child speaks quietly into the middle while another stands at a second dish some distance away and hears it. Needs two children and an adult to position them. Everything else is free running. Allow at least an hour and let them lead."},
 sources:[["Wikipedia: Stanisław Lem","https://en.wikipedia.org/wiki/Stanis%C5%82aw_Lem"],["Encyclopedia of Science Fiction","https://sf-encyclopedia.com/entry/lem_stanislaw"]]},
