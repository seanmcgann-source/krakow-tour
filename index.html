{id:"wawel", addr:"Zamek Królewski na Wawelu, Wawel 5, 31-001 Kraków", day:"d3", seg:0, tag:"split", svg:"wawel",
 title:"Wawel courtyard", sub:"A king who imported the Renaissance", era:"1517–1536",
 story:[
 "Sigismund the Old had seen Italy, and decided Poland should look like it. Fire damaged the medieval castle, and between 1517 and 1536 he rebuilt the place in a style barely seen north of the Alps. Work began under a Florentine architect, continued under a second Florentine after the first died, and ran alongside a local master builder.",
 "A royal marriage sealed the taste. Sigismund married a princess from Milan in 1518, and Italian craftsmen followed her north.",
 "The result surrounds you: open galleries on slender columns, letting the court move freely between apartments and state rooms without going outside. The yard itself became the stage. Kings held tournaments and jousts here, staged theatre and masques, received foreign envoys in front of an audience arranged along the galleries above, and used the whole enclosure as a display of how a Polish court could match anything in Italy. The galleries were the seating. Everyone watching stood where you are looking now.",
 "That use outlasted the kings. After the court left for Warsaw in 1596 the castle slid into decline, and Austrian troops later turned the whole hill into a barracks, bricking up arcades and using the royal rooms as a military hospital and stores. The courtyard spent much of the nineteenth century as a parade ground. Poles bought the Austrians out and began restoring it from 1905, which is why what you see reads as Renaissance again rather than as a barracks yard."],
 why:"This completes an argument you started on the first day. The plaque on the Rynek marks the year a Polish king held Prussia in his hand. This courtyard shows what he spent the confidence on.",
 look:["Look up. Two lower storeys carry regular arcades, and the top storey uses columns of double height, which gives the yard its stretched, light proportion. Count the storeys before you look, then check.",
 "One side has no arcades at all. Occupying German forces rebuilt that wing during the Second World War, over the site of the royal kitchens. Find the odd side out.",
 "The hill, the outer yards and this courtyard cost nothing to walk. The interiors need separate timed tickets."],
 guesses:[
 {q:"In what year did the royal court leave Kraków for Warsaw?", a:"1596. Kraków has now spent over four centuries as a former capital.", src:"here"},
 {q:"Count the columns on the top storey of one side of the courtyard. Guess first.", a:"Count them and settle it. The top storey uses columns of double height, which is the trick that makes the whole yard feel light.", src:"away"}],
 act:{type:"label", kind:"Diagram labelling", prompt:"None of these labels name their own position, so you will have to work each one out.",
  svg:"wawel",
  pins:[{x:76,y:64,a:"Stretched to double height, the trick that makes a heavy building look light"},
        {x:76,y:110,a:"The plain tier, the only one that behaves itself"},
        {x:76,y:160,a:"How the court crossed from room to room without stepping outside"},
        {x:200,y:32,a:"A northern necessity bolted onto an Italian design"}],
  note:"The doubled top columns are the trick. They make a heavy building look light, and Polish builders copied it for generations."},
 verdict:{answer:"As old as it looks", note:"Genuinely 1517 to 1536, apart from one wing rebuilt under German occupation."},
 links:[["Wawel Royal Castle","https://wawel.krakow.pl/en/information-about-museum"]],
 kids:{who:"split", do:"Only the youngest is up here, in the sling. Point out the arches and let her look up.", find:"The one side of the courtyard with no arches at all.", how:"Only the youngest is up here in the sling. It is a large open stone courtyard surrounded by three tiers of arches. Hold her facing outward and point up at the arches, which are the most striking thing about it."},
 sources:[["Wawel Royal Castle: official","https://wawel.krakow.pl/en/information-about-museum"],["In Your Pocket: the courtyard","https://www.inyourpocket.com/krakow/arcaded-renaissance-courtyard_170717v"]]},

{id:"dragon", addr:"Smok Wawelski, Bulwar Czerwieński, 31-001 Kraków", day:"d3", seg:0, tag:"split", svg:"dragon",
 title:"The dragon and the chakra stone", sub:"Two kinds of magic, fifty metres apart", era:"Legend from the 1200s",
 story:[
 "Kraków's founding myth stars a shoemaker who beat a monster with chemistry. A dragon lived in the cave under this hill, eating livestock and, in some tellings, young women handed over as tribute. The king promised his daughter to whoever killed it. Knights failed. A cobbler named Skuba stuffed a lamb with sulphur and left it outside the cave. The dragon ate, the sulphur burned, and the beast ran to the Vistula and drank until it burst.",
 "A bishop of Kraków wrote the tale down as history in the early 1200s. It probably reaches further back into Slavic oral tradition, possibly explaining fossil bones or gas seeping from the cave.",
 "Fifty metres uphill sits a rival kind of magic. A twentieth-century Polish writer merged Slavic folklore with Hindu teaching and declared Wawel one of the earth's seven great energy centres, a stone left by Shiva. Visitors press their palms to a wall, and the church that owns the wall has never enjoyed the arrangement."],
 why:"Kraków sells two competing kinds of magic from the same hill, and the city has never resolved which one it believes. The dragon is official: it appears on souvenirs, in children's books and on the city's own tourist material, a founding myth in which the ordinary townsman outwits the monster that defeated the knights. The chakra stone is unofficial and faintly embarrassing, a 1930s invention that draws quiet visitors to press their hands against a cathedral wall the church would rather they left alone. Both are stories Poles tell about the same fifty metres of rock, and watching which one a Kraków guide chooses to mention tells you a great deal about how the city sees itself.",
 look:["Wait for the flame. Natural gas fuels it, a text message triggers it, and the service handles at least 2,500 requests a day. It cannot fire more often than every fifteen seconds, and somebody has clearly tested that.",
 "Up by the cathedral door, look for old bones hanging on chains, long treated as the dragon's remains. Research identified them as rhinoceros, whale and mammoth."],
 guesses:[
 {q:"How many text messages does the dragon receive in a day?", a:"At least 2,500. Each one asks it to breathe fire, and it cannot oblige more than once every fifteen seconds.", src:"here"},
 {q:"How tall is the statue?", a:"Six metres, cast in 1969 by a sculptor working in a country that had no interest in dragons.", src:"away"}],
 act:{type:"mcq", kind:"Multiple choice",
  prompt:"Bones hang chained beside the cathedral door, long said to be the dragon's. What are they really?",
  opts:["Cattle and horse bones","Rhinoceros, whale and mammoth","Carved wood painted to look like bone","Nobody has ever tested them"],
  answer:1, note:"An ice-age collection, hung up as proof of a dragon, and left hanging long after anyone believed it."},
 verdict:{answer:"A fake", note:"The legend runs to the 1200s. The statue dates from 1969 and the chakra from the 1930s."},
 links:[["Kraków Booking: Wawel legends","https://krakowbooking.com/blog/the-wawel-dragon-and-other-legends-of-the-krakow-castle"]],
 kids:{who:"split", do:"Worth bringing the older two across for, even if the groups have split. Wait for the flame, then count out loud how long until the next one.", find:"The mouth of the cave the dragon supposedly lived in.", how:"Down at the foot of the castle hill by the river, a six-metre bronze dragon on a rock. It breathes real fire at intervals — a proper burst of flame, loud enough to startle a small child, so warn them first. Count out loud between bursts. Behind it is the mouth of the cave the dragon supposedly lived in. Worth bringing the older two across for even if the groups have split."},
 sources:[["Wikipedia: the dragon statue","https://en.wikipedia.org/wiki/Wawel_Dragon_(statue)"],["Kraków Booking","https://krakowbooking.com/blog/the-wawel-dragon-and-other-legends-of-the-krakow-castle"]]},

{id:"dlugosz", addr:"Dom Długosza, ul. Kanonicza 25, 31-002 Kraków", day:"d3", seg:0, tag:"split", svg:null,
 title:"Kanonicza 25", sub:"The house where Poland got its history", era:"1455–1480",
 story:[
 "Jan Długosz spent twenty-five years in this house writing the book that told Poles who they were. A canon of Kraków and a diplomat, he produced the first full history of Poland, a work that gave Poles pride in their past and improved how educated Europe regarded the country.",
 "He started in 1455 and kept writing until the last weeks of his life. He hunted his sources properly, using older chronicles, papal registers, royal charters, inscriptions on monuments, coins and the testimony of people who had witnessed the events.",
 "The king also handed him his sons to tutor, so the man writing the national history taught the next king in person. Nearly everything Poles believe about their earliest centuries, including the dragon and the mounds, passed through this building."],
 why:"Three men invented Poland between them. Długosz wrote the history here, Matejko painted it, and Mickiewicz wrote the feeling that made people willing to die for it. You have now stood in front of all three.",
 look:["The oldest part dates from the early 1300s and held the royal bathhouse, fed with water from a river that once ran along the street behind. Legend claims courtiers of the teenage queen hid here to spy on the man she was about to marry, the same queen who funded the university.",
 "Look at the front for two large Gothic windows and a smaller 15th-century one above, plus a 16th-century doorway carrying an inscription meaning that nothing in a man surpasses reason."],
 guesses:[
 {q:"How many years did Długosz spend writing his history in this house?", a:"Twenty-five, from 1455 until weeks before his death in 1480.", src:"here"},
 {q:"How many books does the finished history run to?", a:"Twelve, covering everything from the legendary founders to his own lifetime.", src:"away"}],
 act:{type:"match", kind:"Matching", prompt:"Tap a man, then tap what he gave Poland.",
  pairs:[["Długosz, in this house","The written history, and the legends we now repeat"],
         ["Matejko, on the square","The pictures that taught it to people who could not read"],
         ["Mickiewicz, on his plinth","The feeling that made people willing to die for it"],
         ["Conrad, on a plaque nearby","A refusal to stay, and a career in another language"]],
  note:"Four men, four ways of making a country exist when it has no state. You have stood in front of all four in three days."},
 verdict:{answer:"Older than it looks", note:"A modest canon's house, and the oldest part of it was a bath."},
 links:[["Britannica: Jan Długosz","https://www.britannica.com/biography/Jan-Dlugosz"]],
 kids:{who:"split", do:"Prettiest door competition, running the length of the street. Everyone picks one and defends it.", find:"A door knocker they can reach.", how:"A narrow cobbled street of old houses running down from the castle, quiet and very pretty. Everyone picks the door they like best and has to say why. Look for carved stone frames, old numbers, iron knockers and studded wood. Let each child choose one they can actually reach and touch."},
 sources:[["Britannica","https://www.britannica.com/biography/Jan-Dlugosz"],["Kraków Travel: Kanonicza Street","https://krakow.travel/en/17719-krakow-kanonicza-street"]]},

{id:"jordana", addr:"Park im. dr. Henryka Jordana, al. 3 Maja 11, 30-062 Kraków", day:"d3", seg:0, tag:"split", svg:null,
 title:"Park Jordana", sub:"The doctor who invented the playground", era:"1889",
 story:[
 "A Kraków doctor looked at industrial city children and prescribed grass. Henryk Jordan opened this park in 1889 on former cattle pasture, the first public playground in Poland and the first of its kind in Europe, fitted with exercise apparatus copied from American models.",
 "He provided a swimming pool, twelve pitches, running tracks, changing rooms and showers, plus indoor facilities from 1906 for bad weather. He also fed the children free.",
 "His argument sounded radical then: supervised, organised play counted as a medical necessity for healthy development rather than mere entertainment, and every social class deserved access. The idea spread across Poland, other cities copied it, and by 1928 a national society existed to build such places everywhere."],
 why:"This park was an argument about who cities are built for. Kraków in the 1880s was crowded, industrialising and unhealthy, and Jordan argued that working-class children were growing up physically ruined by it. His answer, that supervised play is a medical necessity rather than a charity, and that every class has a right to it, was genuinely radical, and Poland adopted it. Cities across the country copied the model, a national society formed to build more, and the type is still called a Jordan garden in Polish. A doctor in a partitioned country with no government of its own invented a piece of public policy and exported it.",
 look:["Jordan set 45 busts of famous Poles among the paths from 1907. Wartime destruction hit the park hard, and one man saved a fraction of them plus the founder's monument.",
 "Among the busts of famous Poles stands a monument to a bear who served as a soldier. Find that one and you win the round. Asphalt paths, pram access, playgrounds, toilets and a café, open 6:00 to 22:00."],
 guesses:[
 {q:"How many busts of famous Poles did the founder set among these paths?", a:"Forty-five, installed from 1907 onwards.", src:"here"},
 {q:"How many of them survived the war?", a:"Twenty-two. One man saved those and the founder's monument. Count how many the children can find.", src:"away"}],
 act:{type:"truefalse", kind:"True or false",
  prompt:"True or false: among the busts of famous Poles in this park, there is a monument to a bear.",
  answer:true, note:"True. A bear who served as a soldier. Set the children hunting for it before you reveal this."},
 verdict:{answer:"Older than it looks", note:"1889, and the original of the type. Every playground your children have used descends from this field."},
 links:[["Trasa dla Bobasa: pram access","https://www.trasadlabobasa.pl/en/tab/parks/jordan_park/2"]],
 kids:{who:"all", do:"Find the bear. There is a monument to a bear who was a soldier, hiding among the busts of famous people.", find:"Three stone heads on the paths, any three.", how:"A large park west of the Old Town with paths, playgrounds and rows of stone busts on plinths along the walkways. Most are famous Poles. Somewhere among them is a monument to a bear who served as a soldier, which is the prize find. Set them hunting for three heads first as a warm-up, then reveal the bear. Toilets and a café on site."},
 sources:[["Wikipedia: Henryk Jordan Park","https://en.wikipedia.org/wiki/Henryk_Jordan_Park"],["In Your Pocket","https://www.inyourpocket.com/krakow/dr-h-jordan-park_21372v"]]},

{id:"pharmacy", addr:"Apteka pod Orłem, plac Bohaterów Getta 18, 30-547 Kraków", day:"d3", seg:1, tag:"all", svg:"chairs", solemn:true,
 title:"Plac Bohaterów Getta and the Eagle Pharmacy", sub:"One pharmacist stayed", era:"1941–1943",
 story:[
 "German authorities enclosed this district as a ghetto in 1941. The three other Gentile-owned pharmacies inside accepted the offer to relocate outside the walls. Tadeusz Pankiewicz bribed officials for permission to remain, and kept working.",
 "He and three colleagues handed out scarce medicines, usually refusing payment, and turned the shop into a crossing point for people, food and news between the sealed district and the city outside. The staff obtained forged papers, traded people's valuables for food, carried messages to relatives in hiding, and concealed people inside the pharmacy during round-ups.",
 "Two details recur in his own account. Hair dye let older people look young enough to escape selection for deportation. Sedatives kept hidden children quiet, and therefore alive, during raids. He also hid Torah scrolls that families left with him, and people recovered them after the war. Doing any of this carried a death sentence.",
 "The memorial outside takes its idea directly from his memoir, where he described an incalculable quantity of wardrobes, tables and sideboards left rotting on the square. Thirty-three large chairs stand in rows suggesting roll-calls, facing the pharmacy. Thirty-seven smaller ones around the edges are meant to be sat on. A paved line across the square marks where the ghetto boundary ran."],
 why:null,
 look:["Deportations gathered here. During the final liquidation on 13 and 14 March 1943, guards shot the elderly, the ill and children in the street before the trains.",

/* ===================== state ===================== */
let db={players:[],log:[],done:{},verdicts:{},skipped:{},fs:1,pins:{}};
try{const r=localStorage.getItem("krk3");if(r)db=Object.assign(db,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem("krk3",JSON.stringify(db));}catch(e){}}
document.documentElement.style.setProperty("--fs",db.fs);

const app=document.getElementById("app"), barTitle=document.getElementById("barTitle"),
      backBtn=document.getElementById("back"), boardEl=document.getElementById("board");
let view={n:"home"}, stack=[];

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* plain shuffle, only guaranteeing the original order is broken */
const shuffled=arr=>{const a=arr.map((v,i)=>({v,i}));
  for(let n=0;n<30;n++){shuffle(a);if(!a.every((x,i)=>x.i===i))break;}
  return a;};
/* for ordering rounds: no item may sit in its correct final position, so the
   layout never hints at the answer and the first item is never the first item */
const scrambled=arr=>{
  const rank=arr.map((o,i)=>i).sort((x,y)=>arr[x].v-arr[y].v); // rank[pos]=index
  const target={}; rank.forEach((idx,pos)=>target[idx]=pos);
  const a=arr.map((v,i)=>({v,i}));
  let best=null;
  for(let n=0;n<80;n++){
    shuffle(a);
    const fixed=a.reduce((c,x,pos)=>c+(target[x.i]===pos?1:0),0);
    if(fixed===0)return a.slice();
    if(best===null||fixed<best.f)best={f:fixed,a:a.slice()};
  }
  return best.a;};
const stop=id=>STOPS.find(s=>s.id===id);
const day=id=>DAYS.find(d=>d.id===id);
const totals=()=>{const t={};db.players.forEach(p=>t[p.id]=0);db.log.forEach(e=>{if(t[e.pid]!=null)t[e.pid]+=e.points;});return t;};
const scorable=STOPS.filter(s=>!s.solemn).length;

function drawBoard(){
  if(!db.players.length){boardEl.innerHTML='<span class="chip empty">No players yet &mdash; tap Players to add some</span>';return;}
  const t=totals();
  boardEl.innerHTML=db.players.slice().sort((a,b)=>t[b.id]-t[a.id])
    .map(p=>`<span class="chip">${esc(p.name)}<b>${t[p.id]}</b></span>`).join("");
}

/* ===================== scoring ===================== */
function award(key,label,meta,points,host){
  const box=host.querySelector(".win");
  const already=()=>db.log.filter(x=>x.key===key);
  let sel=new Set();

  const paint=()=>{
    const won=already();
    if(won.length){
      const names=won.map(e=>e.name);
      const list=names.length===1?names[0]
        :names.slice(0,-1).join(", ")+" and "+names[names.length-1];
      box.innerHTML=`<div class="done">&#10003; ${points} point${points===1?"":"s"} each to ${esc(list)}</div>`;
      return;
    }
    if(db.skipped[key]){
      box.innerHTML=`<div class="done skipped">Nobody got this one</div>`;
      return;
    }
    if(!db.players.length){
      box.innerHTML=`<div class="lab">Who got it?</div><button class="ghost" data-goplayers="1">Add players first</button>`;
      box.querySelector("[data-goplayers]").onclick=()=>go({n:"players"});
      return;
    }
    box.innerHTML=`<div class="lab">Who got it? Tap everyone who did.</div>
      <div class="who">`+db.players.map(p=>
        `<button data-p="${p.id}"${sel.has(p.id)?' class="on"':''}>${esc(p.name)}</button>`).join("")+`</div>
      <div class="winact">
        <button class="solid go"${sel.size?"":" disabled"}>Award ${points} to ${sel.size||"..."}</button>
        <button class="ghost none">Nobody</button>
      </div>`;
    box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.p;
      if(sel.has(id))sel.delete(id); else sel.add(id);
      paint();
    });
    box.querySelector(".go").onclick=()=>{
      if(!sel.size)return;
      const t=new Date().toISOString();
      db.players.filter(p=>sel.has(p.id)).forEach(p=>{
        db.log.push({key,pid:p.id,name:p.name,points,label,...meta,t});
      });
      save();paint();drawBoard();
    };
    box.querySelector(".none").onclick=()=>{
      db.skipped[key]=1;save();paint();
    };
  };
  paint();
}
const settled=key=>db.log.some(x=>x.key===key)||!!db.skipped[key];
const winBox=()=>`<div class="win"></div>`;

/* ===================== activities ===================== */
function activity(a,host,key,meta){
  const el=host, note=t=>`<div class="answer"><strong>Answer</strong>${esc(t)}</div>`;
  let html=`<div class="kind">${esc(a.kind)}</div><div class="prompt">${esc(a.prompt)}</div>`;

  if(a.type==="mcq"||a.type==="truefalse"){
    const opts=a.type==="truefalse"?["True","False"]:a.opts;
    html+=`<div class="optlist">`+opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")+`</div><div class="ansbox"></div>`+winBox();
    el.innerHTML=html;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const right=a.type==="truefalse"?(a.answer?0:1):a.answer;
      el.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;
        if(i===right)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
      el.querySelector(".ansbox").innerHTML=note((a.type==="mcq"?a.opts[a.answer]+". ":"")+a.note);
      award(key,a.kind,meta,10,el);
    });
  }

  else if(a.type==="order"||a.type==="timeline"){
    const picked=[], disp=scrambled(a.opts);
    html+=`<div class="optlist">`+disp.map((o,i)=>`<button class="opt" data-i="${i}"><span class="num">&middot;</span>${esc(o.v.l)}</button>`).join("")+
      `</div><div class="row"><button class="ghost undo">Undo last</button><button class="solid chk" disabled>Check the order</button></div><div class="ansbox"></div>`+winBox();
    el.innerHTML=html;
    const btns=[...el.querySelectorAll(".opt")], chk=el.querySelector(".chk");
    const paint=()=>{btns.forEach((b,i)=>{const p=picked.indexOf(i);
      b.querySelector(".num").textContent=p<0?"\u00b7":(p+1);
      b.classList.toggle("pick",p>=0);b.disabled=p>=0;});
      chk.disabled=picked.length!==a.opts.length;};
    btns.forEach((b,i)=>b.onclick=()=>{picked.push(i);paint();});
    el.querySelector(".undo").onclick=()=>{picked.pop();paint();};
    chk.onclick=()=>{
      // rank of each displayed item by its true value
      const order=disp.map((o,i)=>i).sort((x,y)=>disp[x].v.v-disp[y].v.v);
      let hits=0;
      picked.forEach((idx,pos)=>{const ok=order[pos]===idx;if(ok)hits++;
        btns[idx].classList.remove("pick");btns[idx].classList.add(ok?"right":"wrong");
        btns[idx].querySelector(".num").textContent=(order.indexOf(idx)+1);});
      btns.forEach(b=>b.disabled=true);chk.disabled=true;
      el.querySelector(".ansbox").innerHTML=`<div class="answer"><strong>${hits} of ${a.opts.length} in the right place</strong>${esc(a.note)}</div>`;
      award(key,a.kind,meta,10,el);
    };
  }

  else if(a.type==="sort"){
    let sel=null,solved=0; const disp=shuffled(a.opts).map(x=>x.v);
    html+=`<div class="optlist">`+disp.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.l)}</button>`).join("")+
      `</div><div class="buckets">`+a.buckets.map((b,i)=>`<button data-b="${i}">${esc(b)}</button>`).join("")+
      `</div><div class="ansbox"></div>`+winBox();
    el.innerHTML=html;
    const items=[...el.querySelectorAll(".opt")], bks=[...el.querySelectorAll("[data-b]")];
    items.forEach((b,i)=>b.onclick=()=>{items.forEach(x=>x.classList.remove("pick"));
      b.classList.add("pick");sel=i;});
    bks.forEach(bb=>bb.onclick=()=>{
      if(sel==null)return;
      const o=disp[sel], ok=o.b===+bb.dataset.b, node=items[sel];
      node.classList.remove("pick");node.classList.add(ok?"right":"wrong");node.disabled=true;
      node.insertAdjacentHTML("beforeend",`<span class="cat">${esc(a.buckets[o.b])}</span>`);
      sel=null;solved++;
      if(solved===disp.length){
        el.querySelector(".ansbox").innerHTML=note(a.note);award(key,a.kind,meta,10,el);
      }
    });
  }

  else if(a.type==="match"){
    const left=a.pairs.map((p,i)=>({t:p[0],i})), right=a.pairs.map((p,i)=>({t:p[1],i}))
      .sort(()=>Math.random()-.5);
    let sel=null,solved=0;
    html+=`<div class="howto">Two lists. Tap something in the top list, then tap its partner in the bottom list. Correct pairs turn green and lock. Wrong ones flash red, so keep trying.</div>
      <div class="collab">Top list</div>
      <div class="lcol">`+left.map(x=>`<button class="opt" data-l="${x.i}">${esc(x.t)}</button>`).join("")+`</div>
      <div class="collab">Bottom list &mdash; tap the partner</div>
      <div class="rcol">`+right.map(x=>`<button class="opt" data-r="${x.i}">${esc(x.t)}</button>`).join("")+`</div><div class="ansbox"></div>`+winBox();
    el.innerHTML=html;
    const L=[...el.querySelectorAll("[data-l]")], R=[...el.querySelectorAll("[data-r]")];
    L.forEach(b=>b.onclick=()=>{L.forEach(x=>x.classList.remove("pick"));b.classList.add("pick");sel=b;});
    R.forEach(b=>b.onclick=()=>{
      if(!sel)return;
      if(sel.dataset.l===b.dataset.r){
        sel.classList.remove("pick");sel.classList.add("right");b.classList.add("right");
        sel.disabled=true;b.disabled=true;solved++;
        if(solved===a.pairs.length){el.querySelector(".ansbox").innerHTML=note(a.note);award(key,a.kind,meta,10,el);}
      }else{
        b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),600);
      }
      sel.classList.remove("pick");sel=null;
    });
  }

  else if(a.type==="reflect"){
    html+=`<button class="ghost rev">Ready to score</button><div class="ansbox"></div>`+winBox();
    el.innerHTML=html;
    el.querySelector(".rev").onclick=()=>{
      el.querySelector(".rev").disabled=true;
      el.querySelector(".ansbox").innerHTML=`<div class="answer"><strong>No wrong answers</strong>${esc(a.note)}</div>`;
      award(key,a.kind,meta,10,el);
    };
  }

  else if(a.type==="label"){
    let solved=0, sel=null;
    const order=shuffled(a.pins).map(x=>x.v);
    html+=`<div class="howto">Tap a label below, then tap the numbered point on the drawing that it belongs to. Wrong pairs flash red and you can try again.</div>
      <div class="illus dg">${S[a.svg]||""}</div>
      <div class="lcol">`+order.map((p,i2)=>`<button class="opt" data-lab="${a.pins.indexOf(p)}">${esc(p.a)}</button>`).join("")+
      `</div><div class="ansbox"></div>`+winBox();
    el.innerHTML=html;
    const svg=el.querySelector(".dg svg"), ns="http://www.w3.org/2000/svg";
    const labs=[...el.querySelectorAll("[data-lab]")];
    labs.forEach(b=>b.onclick=()=>{if(b.disabled)return;
      labs.forEach(x=>x.classList.remove("pick"));b.classList.add("pick");sel=b;});
    a.pins.forEach((p,i2)=>{
      const g=document.createElementNS(ns,"g");g.style.cursor="pointer";
      const c=document.createElementNS(ns,"circle");
      c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r",14);
      c.setAttribute("fill","var(--blue)");c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","2.5");
      const t=document.createElementNS(ns,"text");
      t.setAttribute("x",p.x);t.setAttribute("y",p.y+5);t.setAttribute("text-anchor","middle");
      t.setAttribute("font-size","15");t.setAttribute("fill","#fff");t.setAttribute("font-family","sans-serif");
      t.setAttribute("font-weight","bold");t.textContent=i2+1;
      g.appendChild(c);g.appendChild(t);
      g.onclick=()=>{
        if(!sel||g.dataset.done)return;
        if(+sel.dataset.lab===i2){
          g.dataset.done="1";c.setAttribute("fill","var(--green)");
          sel.classList.remove("pick");sel.classList.add("right");
          sel.insertAdjacentHTML("beforeend",`<span class="cat">${i2+1}</span>`);
          sel.disabled=true;sel=null;solved++;
          if(solved===a.pins.length){
            el.querySelector(".ansbox").innerHTML=`<div class="answer"><strong>All ${a.pins.length} placed</strong>${esc(a.note)}</div>`;
            award(key,a.kind,meta,10,el);
          }
        } else {
          c.setAttribute("fill","var(--red)");
          setTimeout(()=>{if(!g.dataset.done)c.setAttribute("fill","var(--blue)");},550);
        }
      };
      svg.appendChild(g);
    });
  }

}

        <p><span class="lab">To find:</span> ${esc(s.kids.find)}</p>
        ${s.kids.how?`<div class="how"><b>What you are looking at</b>${esc(s.kids.how)}</div>`:""}
        ${s.kids.who==="skip"||s.kids.who==="parallel"?""
          :`<div class="scale">${S.scale}${s.id==="krakus"?"Last scale &mdash; the big sticker":"One sticker, one scale"}</div>`}
      </div>`:""}
    ${s.practical?`<h3>Before you go</h3><div class="card"><p style="margin:0">${esc(s.practical)}</p></div>`:""}
    ${s.guesses&&s.guesses.length?`<h3>Can you guess?</h3><p class="note">Two rounds. The first answer is hiding somewhere on this page. The second is not, so just take a punt. Closest wins either way.</p><div id="guesses"></div>`:""}
    ${s.act?`<h3>Activity</h3><div class="act" id="act"></div>`:""}
    ${s.verdict?`<h3>The verdict</h3>
      <div class="verdict" id="verdict">
        <p class="eyebrow">Commit before you reveal</p>
        <p style="margin-bottom:12px">Older than it looks, exactly as old as it looks, or a fake?</p>
        <div class="vrow" id="vrow">${VERD.map(v=>`<button data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>
        <div id="stampwrap"></div>${winBox()}
      </div>`:""}
    ${s.links&&s.links.length?`<h3>Look it up later</h3>
      <p class="sources">${s.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(" &middot; ")}</p>`:""}
    ${s.sources&&s.sources.length?`<h3>Sources</h3>
    <p class="sources">${s.sources.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(" &middot; ")}</p>`:""}`;

  const cp=app.querySelector("#cp");
  cp.onclick=()=>{
    const t=s.addr;
    const done=()=>{cp.textContent="Copied";setTimeout(()=>{cp.textContent="Copy";},1600);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback);}
    else fallback();
    function fallback(){
      const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");
      ta.style.position="absolute";ta.style.left="-9999px";document.body.appendChild(ta);
      ta.select();try{document.execCommand("copy");done();}catch(e){
        const sp=app.querySelector("#addr .a");sp.contentEditable="true";sp.focus();
        cp.textContent="Select it";}
      ta.remove();}
  };
  const meta={day:d?d.title:"Anytime",stopId:s.id,stop:s.title};
  if(s.guesses&&s.guesses.length){
    const g=app.querySelector("#guesses");
    s.guesses.forEach((q,i)=>{
      const box=document.createElement("div");box.className="guess";
      box.innerHTML=`<span class="gsrc ${q.src==="here"?"here":"away"}">${q.src==="here"?"The answer is somewhere on this page":"Not on this page &mdash; just guess"}</span>
        <div class="q">${esc(q.q)}</div><button class="ghost">Reveal</button><div class="ans"></div>${winBox()}`;
      g.appendChild(box);
      const gkey=s.id+"-g"+i;
      const reveal=()=>{
        box.querySelector(".ans").innerHTML=`<div class="answer"><strong>Answer</strong>${esc(q.a)}</div>`;
        box.querySelector(".ghost").disabled=true;
        award(gkey,"Guess round "+(i+1),meta,5,box);
      };
      box.querySelector(".ghost").onclick=reveal;
      if(settled(gkey))reveal();
    });
  }
  if(s.act){
    const akey=s.id+"-act";
    const host=app.querySelector("#act");
    if(settled(akey)){
      host.innerHTML=`<div class="kind">${esc(s.act.kind)}</div>
        <div class="prompt">${esc(s.act.prompt)}</div>
        <div class="answer"><strong>Already played</strong>${esc(s.act.note||"")}</div>
        <button class="ghost again">Play it again</button>`+winBox();
      award(akey,s.act.kind,meta,10,host);
      host.querySelector(".again").onclick=()=>{
        db.log=db.log.filter(x=>x.key!==akey);delete db.skipped[akey];save();drawBoard();render();
      };
    } else activity(s.act,host,akey,meta);
  }
  if(s.verdict){
    const host=app.querySelector("#verdict"), wrap=app.querySelector("#stampwrap"), row=app.querySelector("#vrow");
    const paint=()=>{
      const ch=db.verdicts[s.id];
      row.querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b.dataset.v===ch);b.disabled=!!ch;});
      if(ch){
        const right=ch===s.verdict.answer;
        wrap.innerHTML=`<div class="stamp"${right?' style="border-color:var(--emerald);color:var(--emerald)"':''}>
          <span>${right?"Called it":"The answer is"}</span>${esc(s.verdict.answer)}</div>
          <p class="verdict-note note">${esc(s.verdict.note)}</p>`;
        award(s.id+"-v","Verdict card",meta,5,host);
      }
    };
    row.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      if(db.verdicts[s.id])return;db.verdicts[s.id]=b.dataset.v;db.done[s.id]=1;save();paint();
    });
    paint();
  }
}
const VERD=["Older than it looks","As old as it looks","A fake"];

/* ===================== quiz ===================== */
function renderQuizRound(r){
  barTitle.textContent=r.round;
  app.innerHTML=`<p class="eyebrow" style="margin-top:22px">Before you go</p><h2>${esc(r.round)}</h2>
    <p class="lede">${esc(r.blurb)}</p><div id="items"></div>`;
  const host=app.querySelector("#items");

  r.items.forEach((it,i)=>{
    const box=document.createElement("div");box.className="act";box.style.borderTopColor="var(--brass)";
    host.appendChild(box);
    const meta={day:"Opening quiz",stopId:r.id,stop:r.round};
    const key=r.id+"-"+i;

    if(r.kind==="order"){
      box.innerHTML=`<div class="hostslot"></div>`;
      activity({type:"order",kind:"Order Five",prompt:it.prompt,opts:it.opts,note:it.note},box.querySelector(".hostslot"),key,meta);
    }

    if(r.kind==="mcq"){
      box.innerHTML=`<div class="kind" style="color:var(--gold)">Multiple choice</div>
        <div class="prompt">${esc(it.q)}</div>
        <div class="optlist">`+it.opts.map((o,j2)=>`<button class="opt" data-o="${j2}">${esc(o)}</button>`).join("")+
        `</div><div class="ans"></div>${winBox()}`;
      box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        box.querySelectorAll(".opt").forEach((x,j2)=>{x.disabled=true;
          if(j2===it.a)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
        box.querySelector(".ans").innerHTML=`<div class="answer"><strong>${esc(it.opts[it.a])}</strong>${esc(it.note)}</div>`;
        award(key,"Polish general knowledge",meta,5,box);
      });
    }
    if(r.kind==="tf"){
      box.innerHTML=`<div class="kind" style="color:var(--brass)">True or false</div>
        <div class="prompt">${esc(it.s)}</div>
        <div class="tfrow"><button class="opt" data-t="1">True</button><button class="opt" data-t="0">False</button></div>
        <div class="ans"></div>${winBox()}`;
      box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          x.classList.add((x.dataset.t==="1")===it.a?"right":"wrong");});
        box.querySelector(".ans").innerHTML=`<div class="answer"><strong>${it.a?"True":"False"}</strong>${esc(it.note)}</div>`;
        award(key,"True or false",meta,5,box);
      });
    }

    if(r.kind==="rich"){
      box.innerHTML=`<div class="kind" style="color:var(--gold)">60 Seconds</div><div class="prompt">${esc(it.prompt)}</div>
        <p class="note">Sixty seconds. Write down as many as you can, one list between you or everyone racing separately.</p>
        <div class="timer">1:00</div><div class="timerbar"><i></i></div>
        <div class="row"><button class="solid start">Start the clock</button>
          <button class="ghost rev" disabled>Reveal the list</button></div>
        <div class="ans"></div>${winBox()}`;
      const tEl=box.querySelector(".timer"), bar=box.querySelector(".timerbar i"),
            st=box.querySelector(".start"), rv=box.querySelector(".rev");
      let left=60, iv=null;
      const show=()=>{tEl.textContent="0:"+String(left).padStart(2,"0");
        if(left<=10)tEl.classList.add("low");
        bar.style.width=(left/60*100)+"%";};
      st.onclick=()=>{
        if(iv)return;
        st.disabled=true;st.textContent="Running";
        iv=setInterval(()=>{left--;show();
          if(left<=0){clearInterval(iv);iv=null;tEl.textContent="Time";st.textContent="Time up";rv.disabled=false;}},1000);
      };
      rv.onclick=()=>{
        if(iv){clearInterval(iv);iv=null;}
        rv.disabled=true;st.disabled=true;
        box.querySelector(".ans").innerHTML=`<div class="answer"><strong>${it.list.length} on the list</strong>${
          it.list.map(esc).join(" &middot; ")}<br><br>${esc(it.note)}</div>`;
        award(key,"60 Seconds",meta,5,box);
      };
      show();
    }
  });
}

/* ===================== players & export ===================== */
function renderFood(){
  barTitle.textContent="Food and drink";
  app.innerHTML=`<h1>Food and drink</h1>
    <p class="lede">Forty things Poland eats and drinks, and how each one came to be Polish. Nothing here is a plan. It is a list to point at when a menu arrives in a language nobody can read.</p>`+
    FOOD.map((g,i)=>`
      <h3>${esc(g.group)}</h3>
      <div class="fgroup${i===0?" top":""}">
        ${g.note?`<p class="gnote">${esc(g.note)}</p>`:""}
        ${g.items.map(it=>`<div class="fitem"><div class="fn">${esc(it.n)}</div><div class="fd">${esc(it.d)}</div>${
          it.src?`<div class="fsrc">${it.src.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(" &middot; ")}</div>`:""
        }</div>`).join("")}
        ${g.more?`<p class="fmore"><span>Further reading</span> ${g.more.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(" &middot; ")}</p>`:""}
      </div>`).join("")+
    `<hr class="rule"><p class="note">Every link above opens a page about the food itself: where it came from, who ate it and why it survived. They need signal, so they are better read over coffee than in a queue.</p>`;
}

function renderPlayers(){
  barTitle.textContent="Players";
  const t=totals();
  app.innerHTML=`<h1>Players</h1>
    <p class="lede">Add whoever is playing, however you like: one name each, or two team names, or three. Points get awarded to whoever is on this list, so set it up on the day and change it whenever you want.</p>
    <div id="list"></div>
    <div class="row" style="margin:16px 0">
      <input type="text" id="nm" placeholder="Name or team" maxlength="24" style="flex:1;min-width:180px">
      <button class="solid" id="add">Add</button>
    </div>
    <hr class="rule">
    <h3>Export the scores</h3>
    <p class="note">One tap makes a spreadsheet file of every round played, who won it and when. Open it in Excel, or attach it to an email yourself. Works offline.</p>
    <div class="row"><button class="solid" id="csv">Download the scores</button>
      <button class="ghost" id="mail">Open in email instead</button></div>
    <p class="note" id="expnote" style="margin-top:10px">${db.log.length} rounds recorded so far.</p>
    <hr class="rule">
    <h3>Start over</h3>
    <div id="resetzone"><button class="ghost warn" id="rs">Reset everything</button></div>`;

  const list=app.querySelector("#list");
  list.innerHTML=db.players.length?db.players.map(p=>
    `<div class="player"><span class="nm">${esc(p.name)}</span><span class="pts">${t[p.id]}</span>
     <button data-del="${p.id}" aria-label="Remove ${esc(p.name)}">&times;</button></div>`).join("")
    :`<p class="note">Nobody yet.</p>`;
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    db.players=db.players.filter(p=>p.id!==b.dataset.del);save();renderPlayers();drawBoard();});

  const addNow=()=>{
    const v=app.querySelector("#nm").value.trim();
    if(!v)return;
    db.players.push({id:uid(),name:v});save();renderPlayers();drawBoard();
    setTimeout(()=>{const n=app.querySelector("#nm");if(n)n.focus();},0);
  };
  app.querySelector("#add").onclick=addNow;
  app.querySelector("#nm").addEventListener("keydown",e=>{if(e.key==="Enter")addNow();});
  app.querySelector("#csv").onclick=exportCSV;
  app.querySelector("#mail").onclick=exportMail;

  /* two-tap reset, no browser dialogue */
  const zone=app.querySelector("#resetzone");
  app.querySelector("#rs").onclick=()=>{
    zone.innerHTML=`<div class="solemn-note" style="margin-bottom:10px">This clears every score, every verdict and the whole export. It cannot be undone.</div>
      <div class="row"><button class="ghost warn" id="yes">Yes, reset everything</button><button class="solid" id="no">Keep it</button></div>`;
    zone.querySelector("#no").onclick=()=>renderPlayers();
    zone.querySelector("#yes").onclick=()=>{
      db.log=[];db.done={};db.verdicts={};db.skipped={};db.pins={};save();drawBoard();renderPlayers();
    };
  };
}

function csvText(){
  const rows=[["Day","Stop","Round","Winner","Points","Time"]];
  db.log.forEach(e=>rows.push([e.day||"",e.stop||"",e.label||"",e.name||"",e.points,(e.t||"").replace("T"," ").slice(0,19)]));
  const t=totals();
  rows.push([]);rows.push(["TOTALS"]);
  db.players.slice().sort((a,b)=>t[b.id]-t[a.id]).forEach(p=>rows.push(["","",p.name,"",t[p.id],""]));
  return rows.map(r=>r.map(c=>{const s=String(c==null?"":c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\r\n");
}
function download(name,text,mime){
  const blob=new Blob(["\ufeff"+text],{type:mime});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
}
function exportCSV(){
  if(!db.log.length){app.querySelector("#expnote").textContent="Nothing recorded yet, so there is nothing to export.";return;}
  download("krakow-scores.csv",csvText(),"text/csv;charset=utf-8");
  app.querySelector("#expnote").textContent="Downloaded krakow-scores.csv with "+db.log.length+" rounds. Open it in Excel.";
}
function exportMail(){
  const t=totals();
  const body="Kraków scores\n\n"+db.players.slice().sort((a,b)=>t[b.id]-t[a.id])
    .map(p=>p.name+": "+t[p.id]).join("\n")+"\n\n"+db.log.length+" rounds played.\n\n"+
    db.log.map(e=>[e.day,e.stop,e.label,e.name,e.points].join(" | ")).join("\n");
  location.href="mailto:?subject="+encodeURIComponent("Kraków scores")+"&body="+encodeURIComponent(body.slice(0,1800));
}

/* ===================== lists ===================== */
function renderHome(){
  barTitle.textContent="A Weekend in Krakow - As Old As It Looks";
  app.innerHTML=`<h1>A Weekend in Krakow - As Old As It Looks</h1>
    <p class="lede">The tour of Krakow as it is described on this web page shows a genuinely fascinating city, though one that sometimes pretends to be younger than it is and other times it pretends to be older. It also exaggerates itself or makes things up for the sake of a good story. With all that in mind, I can't think of a better place to mark a milestone in Paul's life and a family holiday.</p>
    <div class="feature" data-s="zielonyjar" role="button" tabindex="0">
      <p class="eyebrow">Saturday, 9am &middot; the last letter</p>
      <div class="feature-title">Zielony Jar parkrun</div>
      <p class="feature-sub">25 letters conquered, Z nearly in the bag, and only J left standing. The stop, the family memories and the photographs.</p>
      <p class="feature-link"><a href="https://www.parkrun.pl/zielonyjar/" target="_blank" rel="noopener">Zielony Jar parkrun on parkrun.pl &rarr;</a></p>
    </div>
    <h3>Do this one first</h3>
    ${QUIZ.map(q=>`<button class="btn quiz" data-q="${q.id}">${esc(q.round)}<small>${esc(q.blurb.split(".")[0])}.</small></button>`).join("")}
    <h3>Then, in this order</h3>
    ${DAYS.map(d=>{
      const n=STOPS.filter(s=>s.day===d.id).length;
      return `<button class="btn" data-d="${d.id}">${esc(d.title)}<small>${n} stops. ${esc(d.blurb)}</small></button>`;
    }).join("")}
    <h3>Anytime</h3>
    <button class="btn quiz" data-food="1">Food and drink<small>Forty things worth eating and drinking, and how each one became Polish.</small></button>
    <hr class="rule">
    <div class="row"><button class="solid" id="pl">Players and scores</button></div>`;
  app.querySelector("[data-food]").onclick=()=>go({n:"food"});
  app.querySelectorAll("[data-s]").forEach(b=>{
    b.onclick=e=>{if(e.target.closest("a"))return;go({n:"stop",id:b.dataset.s});};
    b.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&!e.target.closest("a")){e.preventDefault();go({n:"stop",id:b.dataset.s});}};
  });
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>go({n:"quiz",id:b.dataset.q}));
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>go({n:"day",id:b.dataset.d}));
  app.querySelector("#pl").onclick=()=>go({n:"players"});
}

function renderDay(d){
  barTitle.textContent=d.title;
  const mine=STOPS.filter(s=>s.day===d.id);
  app.innerHTML=`<h1>${esc(d.title)}</h1><p class="lede">${esc(d.blurb)}</p>`+
    d.segs.map((seg,si)=>{
      const list=mine.filter(s=>s.seg===si).sort((a,b)=>(a.ord==null?99:a.ord)-(b.ord==null?99:b.ord));
      if(!list.length)return "";
      return list.map(s=>{
        const tag=s.tag==="food"?'<span class="tag food">Food</span><br>':'';
        return `<button class="btn${db.done[s.id]?" done":""}${s.solemn?" solemn":""}" data-s="${s.id}">
          ${tag}${esc(s.title)}<small>${esc(s.sub)}</small></button>`;}).join("");
    }).join("");
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>go({n:"stop",id:b.dataset.s}));
}

/* ===================== chrome ===================== */
function go(v){stack.push(view);view=v;render();}
function armsHeadings(){
  app.querySelectorAll("h3").forEach(h=>{if(!h.querySelector(".arms"))h.insertAdjacentHTML("afterbegin",S.arms);});
}
function render(){
  drawBoard();
  backBtn.classList.toggle("hide",view.n==="home");
  if(view.n==="home")renderHome();
  else if(view.n==="day")renderDay(day(view.id));
  else if(view.n==="stop")renderStop(stop(view.id));
  else if(view.n==="quiz")renderQuizRound(QUIZ.find(q=>q.id===view.id));
  else if(view.n==="players")renderPlayers();
  else if(view.n==="food")renderFood();
  armsHeadings();
  window.scrollTo(0,0);
}
backBtn.onclick=()=>{view=stack.pop()||{n:"home"};render();};
document.getElementById("fs").onclick=()=>{
  const steps=[1,1.15,1.3,1.5];
  db.fs=steps[(steps.indexOf(db.fs)+1)%steps.length];
  document.documentElement.style.setProperty("--fs",db.fs);save();
};
render();
</script>
