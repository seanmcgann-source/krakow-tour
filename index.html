<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Weekend in Krakow - As Old As It Looks</title>
<style>
:root{
  /* Polish flag: white above, crimson below. Kraków's arms: blue wall, gold-crowned white eagle. */
  --ink:#1A1A20; --ink-soft:#4C4C58;
  --paper:#F7F4F0;            /* warm flag-white */
  --card:#FFFFFF;
  --red:#C1121F;              /* Polish crimson */
  --red-deep:#8E0E17;
  --blue:#1B4B8F;             /* Kraków arms blue */
  --blue-dim:#3E6BA8;
  --gold:#B0872B;             /* the eagle's crown */
  --green:#2C6E49;
  --rule:#DCD5CC; --fs:1;
  --display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  /* legacy names kept so nothing breaks */
  --lapis:var(--blue); --lapis-dim:var(--blue-dim); --brass:var(--gold);
  --crimson:var(--red); --emerald:var(--green);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:calc(17px*var(--fs));line-height:1.55;padding-bottom:110px;-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto;padding:0 18px}

/* bar */
.bar{position:sticky;top:0;z-index:40;background:var(--red);color:#fff;
  border-bottom:3px solid var(--gold);
  background-image:linear-gradient(#fff 0,#fff 4px,var(--red) 4px)}
.bar-in{max-width:660px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:8px}
.bar-title{font-family:var(--display);font-size:calc(15px*var(--fs));flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{font-family:var(--body);font-size:calc(13px*var(--fs));background:rgba(255,255,255,.14);
  color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:8px 11px;cursor:pointer}
.bar button:active{background:rgba(255,255,255,.32)}
.board{background:var(--red-deep);color:#fff;font-size:calc(13px*var(--fs));padding:7px 14px;
  display:flex;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.board .chip{background:rgba(255,255,255,.12);border-radius:20px;padding:4px 12px;flex:0 0 auto}
.board .chip b{color:var(--brass);margin-left:6px}
.board .empty{opacity:.65;font-style:italic}

/* type */
h1{font-family:var(--display);font-weight:normal;font-size:calc(33px*var(--fs));line-height:1.12;margin:24px 0 8px;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:normal;font-size:calc(27px*var(--fs));line-height:1.15;margin:4px 0 10px}
h3{font-size:calc(12px*var(--fs));text-transform:uppercase;letter-spacing:.15em;color:var(--blue);
  margin:28px 0 10px;font-weight:700;display:flex;align-items:center;gap:9px}
h3:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
h3 .arms{flex:0 0 auto;width:15px;height:15px}
p{margin:0 0 14px}
.lede{color:var(--ink-soft);font-size:calc(16px*var(--fs))}
.eyebrow{font-size:calc(11px*var(--fs));text-transform:uppercase;letter-spacing:.16em;color:var(--brass);font-weight:700;margin:0 0 6px}
hr.rule{height:0;border:0;margin:28px 0;text-align:center;overflow:visible}
hr.rule:after{content:"";display:block;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--red) 50%,var(--gold) 80%,transparent);
  opacity:.55}

/* buttons */
.btn{display:block;width:100%;text-align:left;font-family:var(--body);font-size:calc(17px*var(--fs));
  background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--blue);border-radius:4px;
  padding:15px 16px;margin:0 0 10px;cursor:pointer;color:var(--ink);line-height:1.35}
.btn:active{background:#e7ebf3}
.btn small{display:block;color:var(--ink-soft);font-size:calc(13px*var(--fs));margin-top:3px}
.btn.done{border-left-color:var(--emerald)}
.btn.solemn{border-left-color:var(--crimson)}
.btn.quiz{border-left-color:var(--gold);background:#FBF6E9}
.ghost{font-family:var(--body);font-size:calc(15px*var(--fs));background:transparent;border:1px solid var(--rule);
  border-radius:4px;padding:12px 16px;cursor:pointer;color:var(--ink-soft)}
.ghost.warn{border-color:var(--crimson);color:var(--crimson)}
.solid{font-family:var(--body);font-size:calc(15px*var(--fs));background:var(--lapis);color:#fff;
  border:0;border-radius:4px;padding:13px 18px;cursor:pointer;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* cards */
.card{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:18px;margin:0 0 16px}
.story{border-left:5px solid var(--brass)}
.story p:last-child{margin-bottom:0}
.why{background:#EEF2F9;border:1px solid #C8D5E8;border-radius:5px;padding:15px 18px;margin-bottom:16px}
.why p{margin:0}
.why .eyebrow{color:var(--lapis)}
.look{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--emerald);border-radius:5px;padding:18px;margin-bottom:16px}
.look p:last-child{margin-bottom:0}
.look .eyebrow{color:var(--emerald)}
.guide{background:var(--gold);color:#1A1A20;border-radius:5px;padding:13px 17px;margin-bottom:18px;
  font-size:calc(15px*var(--fs));font-weight:600}
.solemn-note{background:#FAE9EA;border:1px solid var(--crimson);border-left:5px solid var(--crimson);
  border-radius:4px;padding:15px 17px;margin-bottom:16px;font-size:calc(16px*var(--fs))}
.note{font-size:calc(15px*var(--fs));color:var(--ink-soft)}

/* illustration */
.illus{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:10px;margin-bottom:16px}
.illus svg{display:block;width:100%;height:auto}
.illus figcaption{font-size:calc(12px*var(--fs));color:var(--ink-soft);text-align:center;padding:8px 6px 2px;font-style:italic}

/* activity */
.act{background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--crimson);border-radius:5px;padding:18px;margin-bottom:16px}
.act .kind{font-size:calc(11px*var(--fs));text-transform:uppercase;letter-spacing:.15em;color:var(--crimson);font-weight:700;margin-bottom:8px}
.act .prompt{font-family:var(--display);font-size:calc(20px*var(--fs));line-height:1.3;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;font-family:var(--body);font-size:calc(16px*var(--fs));
  background:transparent;border:1px solid var(--rule);border-radius:4px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.pick{border-color:var(--blue);background:#EEF2F9}
.opt.right{border-color:var(--green);background:#E6F1EA;font-weight:600}
.opt.wrong{border-color:var(--red);background:#FAE9EA}
.opt .num{display:inline-block;min-width:26px;font-weight:700;color:var(--lapis)}
.opt .cat{float:right;font-size:calc(13px*var(--fs));color:var(--lapis);font-weight:700}
.answer{background:#E6F1EA;border:1px solid var(--green);border-radius:4px;padding:14px 16px;margin-top:12px;font-size:calc(16px*var(--fs))}
.answer strong{color:var(--emerald);display:block;text-transform:uppercase;letter-spacing:.12em;font-size:calc(11px*var(--fs));margin-bottom:5px}
.buckets{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.buckets button{flex:1 1 40%;font-family:var(--body);font-size:calc(15px*var(--fs));padding:12px 8px;
  border:1px solid var(--lapis);background:transparent;color:var(--lapis);border-radius:4px;cursor:pointer;font-weight:600}
.buckets button.on{background:var(--lapis);color:#fff}

/* guess rounds */
.guess{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--lapis-dim);border-radius:5px;padding:16px 18px;margin-bottom:12px}
.guess .q{font-family:var(--display);font-size:calc(18px*var(--fs));line-height:1.3;margin-bottom:10px}

/* the children's brief */
.kids{background:#FBF6E9;border:1px solid var(--gold);border-left:5px solid var(--gold);
  border-radius:5px;padding:16px 18px;margin-bottom:16px}
.kids .eyebrow{color:var(--gold);display:flex;align-items:center;gap:7px}
.kids .eyebrow svg{width:15px;height:15px;flex:0 0 auto}
.kids p{margin:0 0 10px}
.kids p:last-child{margin-bottom:0}
.kids .lab{font-weight:700;color:var(--ink)}
.kids.skip{background:#F3F1EE;border-color:var(--rule);border-left-color:var(--ink-soft);opacity:.9}
.kids.skip .eyebrow{color:var(--ink-soft)}
.scale{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 12px;
  background:var(--gold);color:#fff;border-radius:20px;font-size:calc(13px*var(--fs));font-weight:700}
.scale svg{width:14px;height:14px}

/* food & drink */
.fgroup{margin-bottom:26px}
.fgroup .gnote{font-size:calc(14px*var(--fs));color:var(--ink-soft);margin:-4px 0 12px;font-style:italic}
.fitem{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--gold);
  border-radius:4px;padding:13px 15px;margin-bottom:9px}
.fitem .fn{font-family:var(--display);font-size:calc(19px*var(--fs));margin-bottom:5px;color:var(--ink)}
.fitem .fd{font-size:calc(15px*var(--fs));color:var(--ink-soft);line-height:1.5}
.fgroup.top .fitem{border-left-color:var(--red);background:#FDF6F6}
.fgroup.top .fitem .fn{color:var(--red-deep)}
.fitem .fsrc{margin-top:9px;padding-top:8px;border-top:1px dotted var(--rule);
  font-size:calc(13px*var(--fs));line-height:1.45}
.fitem .fsrc a{color:var(--blue);word-break:break-word}
.fmore{font-size:calc(13px*var(--fs));color:var(--ink-soft);margin:10px 0 0;padding:9px 12px;
  background:#EEF2F9;border-radius:4px}
.fmore span{text-transform:uppercase;letter-spacing:.13em;font-weight:700;font-size:calc(11px*var(--fs));
  color:var(--blue);margin-right:6px}
.fmore a{color:var(--blue);word-break:break-word}

/* the kids' walkthrough */
.kids .how{background:#fff;border:1px dashed var(--gold);border-radius:4px;padding:12px 14px;
  margin-top:12px;font-size:calc(15px*var(--fs));line-height:1.5;color:var(--ink)}
.kids .how b{display:block;font-size:calc(11px*var(--fs));text-transform:uppercase;letter-spacing:.14em;
  color:var(--gold);margin-bottom:6px;font-weight:700}

/* guess source chip */
.gsrc{display:inline-block;font-size:calc(10px*var(--fs));text-transform:uppercase;letter-spacing:.13em;
  font-weight:700;padding:3px 8px;border-radius:3px;margin-bottom:8px}
.gsrc.here{background:#EEF2F9;color:var(--blue);border:1px solid var(--blue-dim)}
.gsrc.away{background:#FBF6E9;color:var(--gold);border:1px solid var(--gold)}

/* how-to line above an activity */
.howto{font-size:calc(14px*var(--fs));color:var(--ink-soft);background:#FBF6E9;border-left:3px solid var(--gold);
  padding:9px 12px;border-radius:3px;margin-bottom:14px}

/* the parkrun stop: intro, family memories, photographs */
.intro-note{background:#FBF6E9;border:1px solid var(--gold);border-left:5px solid var(--gold);
  border-radius:5px;padding:16px 18px;margin-bottom:18px;font-size:calc(17px*var(--fs));line-height:1.5}
.intro-note .eyebrow{color:var(--gold)}
.intro-note p{margin:0}
.memory{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--blue-dim);
  border-radius:5px;padding:15px 18px;margin-bottom:10px}
.memory p{margin:0 0 9px;font-size:calc(16px*var(--fs));line-height:1.55}
.memory .who{margin:0;font-family:var(--display);font-size:calc(15px*var(--fs));color:var(--blue);font-style:italic}
.memory .who:before{content:"\2014\00a0"}
.memory.short p{font-family:var(--display);font-size:calc(24px*var(--fs));margin-bottom:6px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media (max-width:520px){.gallery{grid-template-columns:1fr}}
.gallery.solo{grid-template-columns:1fr;margin:0 0 18px}

/* the headline block on the front page */
.feature{background:linear-gradient(180deg,#FFFDF5,#FBF3E2);
  border:2px solid var(--gold);border-left:9px solid var(--red);border-radius:6px;
  padding:18px 20px 16px;margin:20px 0 30px;box-shadow:0 3px 10px rgba(26,26,32,.09)}
.feature{cursor:pointer;-webkit-tap-highlight-color:transparent}
.feature:active{background:linear-gradient(180deg,#FBF3E2,#F6EAD2)}
.feature:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.feature .eyebrow{color:var(--red)}
.feature-title{font-family:var(--display);font-size:calc(29px*var(--fs));line-height:1.12;margin:0 0 6px}
.feature-sub{margin:0 0 14px;color:var(--ink-soft);font-size:calc(16px*var(--fs))}
.feature-link{margin:0;font-size:calc(15px*var(--fs))}
.feature-link a{color:var(--blue);font-weight:600}
.gallery figure{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:8px}
.gallery img{display:block;width:100%;height:auto;border-radius:3px;background:#EDE8E2}
.gallery figcaption{font-size:calc(13px*var(--fs));color:var(--ink-soft);line-height:1.4;
  padding:8px 4px 2px;font-style:italic}

/* countdown */
.timer{font-family:var(--display);font-size:calc(40px*var(--fs));text-align:center;color:var(--blue);
  padding:6px 0 2px;letter-spacing:.02em}
.timer.low{color:var(--red)}
.timerbar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:12px}
.timerbar i{display:block;height:100%;background:var(--red);width:100%;transition:width 1s linear}

/* column label in a matching round */
.collab{font-size:calc(11px*var(--fs));text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);
  font-weight:700;margin:14px 0 8px}
.lcol .opt .cat,.optlist .opt .cat{background:var(--green);color:#fff;border-radius:3px;padding:1px 8px;font-size:calc(12px*var(--fs))}

/* verdict stamp */
.verdict{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:18px;margin-bottom:16px;overflow:hidden}
.verdict .eyebrow{color:var(--crimson)}
.vrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.vrow button{flex:1 1 30%;font-family:var(--body);font-size:calc(14px*var(--fs));padding:13px 8px;
  border:1px solid var(--crimson);background:transparent;color:var(--crimson);border-radius:4px;cursor:pointer;font-weight:600}
.vrow button.on{background:var(--crimson);color:#fff}
.stamp{margin-top:14px;border:4px double var(--crimson);color:var(--crimson);padding:12px 14px;
  transform:rotate(-2.5deg);text-align:center;font-family:var(--display);font-size:calc(20px*var(--fs));
  line-height:1.2;animation:thud .45s cubic-bezier(.2,1.5,.4,1) both}
.stamp span{display:block;font-family:var(--body);font-size:calc(11px*var(--fs));text-transform:uppercase;
  letter-spacing:.16em;margin-bottom:6px;opacity:.8}
@keyframes thud{from{transform:rotate(-2.5deg) scale(2.4);opacity:0}to{transform:rotate(-2.5deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}

/* winner picker */
.win{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}
.win .lab{font-size:calc(12px*var(--fs));text-transform:uppercase;letter-spacing:.13em;color:var(--ink-soft);margin-bottom:8px;font-weight:700}
.win .who{display:flex;gap:6px;flex-wrap:wrap}
.win .who button{font-family:var(--body);font-size:calc(14px*var(--fs));padding:9px 13px;border-radius:20px;
  border:1px solid var(--lapis);background:transparent;color:var(--lapis);cursor:pointer}
.win .who button.on{background:var(--emerald);border-color:var(--emerald);color:#fff}
.win .who button:disabled{opacity:.45}
.win .done{color:var(--green);font-weight:600;font-size:calc(14px*var(--fs))}
.win .done.skipped{color:var(--ink-soft);font-weight:500;font-style:italic}
.win .who button.on{background:var(--green);border-color:var(--green);color:#fff}
.winact{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.winact .solid{flex:1 1 auto;font-size:calc(14px*var(--fs));padding:11px 14px}
.winact .solid:disabled{opacity:.4}
.winact .ghost{font-size:calc(14px*var(--fs));padding:11px 14px}

/* players */
.player{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);
  border-radius:4px;padding:12px 14px;margin-bottom:8px}
.player .nm{flex:1;font-weight:600}
.player .pts{color:var(--brass);font-weight:700}
.player button{background:transparent;border:0;color:var(--crimson);font-size:calc(18px*var(--fs));cursor:pointer;padding:0 6px}
input[type=text]{font-family:var(--body);font-size:calc(16px*var(--fs));padding:13px 14px;border:1px solid var(--rule);
  border-radius:4px;width:100%;background:#fff;color:var(--ink)}

/* address bar */
.addr{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);
  border-left:5px solid var(--lapis-dim);border-radius:4px;padding:11px 12px;margin-bottom:16px}
.addr .a{flex:1;font-size:calc(14px*var(--fs));color:var(--ink-soft);line-height:1.35;word-break:break-word}
.addr button{font-family:var(--body);font-size:calc(13px*var(--fs));background:var(--lapis);color:#fff;
  border:0;border-radius:4px;padding:9px 14px;cursor:pointer;flex:0 0 auto;font-weight:600}

/* pin bar */
.pinbar{margin-bottom:10px}
.pinbar .lab{display:block;font-size:calc(12px*var(--fs));text-transform:uppercase;letter-spacing:.13em;
  color:var(--ink-soft);margin-bottom:8px;font-weight:700}
.pinbar .who{display:flex;gap:6px;flex-wrap:wrap}
.pinbar .who button{font-family:var(--body);font-size:calc(14px*var(--fs));padding:9px 13px;border-radius:20px;
  border:1px solid var(--crimson);background:transparent;color:var(--crimson);cursor:pointer}
.pinbar .who button.on{background:var(--crimson);color:#fff}

/* map */
.mapwrap{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:8px;margin-bottom:12px;position:relative}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.tag{display:inline-block;font-size:calc(10px*var(--fs));text-transform:uppercase;letter-spacing:.14em;
  padding:4px 9px;border-radius:3px;font-weight:700;margin:0 6px 6px 0}
.tag.all{background:var(--gold);color:#fff}
.tag.split{background:var(--lapis);color:#fff}
.tag.food{background:#e6ebf6;color:var(--lapis);border:1px solid var(--lapis-dim)}
.sources{font-size:calc(14px*var(--fs));color:var(--ink-soft)}
.sources a{color:var(--lapis);word-break:break-word}
footer{margin:36px 0 10px;font-size:calc(13px*var(--fs));color:var(--ink-soft);text-align:center}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.hide{display:none}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <button id="back" class="hide">&larr; Back</button>
    <div class="bar-title" id="barTitle">A Weekend in Krakow - As Old As It Looks</div>
    <button id="fs">A<sup>+</sup></button>
  </div>
  <div class="board" id="board"></div>
</div>
<div class="wrap" id="app"></div>
<footer class="wrap">Kraków &middot; three days</footer>
<script>
/* ===== hand-drawn SVG illustrations: no photos, no network ===== */
const S={};
const P='stroke="var(--lapis)" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';
const B='stroke="var(--brass)" fill="none" stroke-width="2" stroke-linecap="round"';
const F='fill="var(--brass)" opacity=".18"';

S.sukiennice=`<svg viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Cloth Hall">
<path ${F} d="M40 150h320V70H40z"/>
<path ${P} d="M30 150h340M40 150V72h320v78"/>
<path ${P} d="M40 72l30-22h260l30 22"/>
${[0,1,2,3,4,5,6].map(i=>`<path ${P} d="M${62+i*40} 150v-34a14 14 0 0 1 28 0v34"/>`).join('')}
<path ${B} d="M60 62h280M74 50c4-8 12-8 16 0M114 50c4-8 12-8 16 0M154 50c4-8 12-8 16 0M194 50c4-8 12-8 16 0M234 50c4-8 12-8 16 0M274 50c4-8 12-8 16 0M314 50c4-8 12-8 16 0"/>
<path ${P} d="M182 30h36v20h-36zM200 30V16"/><circle cx="200" cy="12" r="4" ${P}/>
</svg>`;

S.adalbert=`<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="St Adalbert's, raised out of the rising square">
<path fill="var(--brass)" opacity=".13" d="M0 128h400v82H0z"/>
<path ${P} d="M0 128h400"/>

{id:"q-mcq", round:"Polish general knowledge", kind:"mcq",
 blurb:"Seven questions, four answers each, and a plausible wrong answer hiding in every one. Argue it out before anybody taps.",
 items:[
  {q:"Three of these four are Polish. Which one is not?",
   opts:["Marie Curie, who won two Nobel prizes","Joseph Conrad, who wrote Heart of Darkness",
         "Nicolaus Copernicus, the astronomer","Sigmund Freud, the father of psychoanalysis"],
   a:3, note:"Freud was Austrian. Conrad is the trap: he wrote in English, took an English name, became a British subject and sits on the shelf with English novelists, but he was born J\u00f3zef Korzeniowski and was orphaned here in Krak\u00f3w at eleven. You stand at his plaque on the first day. All four built their careers outside the country they were born in, which is rather the point."},
  {q:"What is the capital of Poland?",
   opts:["Kraków","Warsaw","Gdańsk","Wrocław"],
   a:1, note:"Warsaw, since 1596, when the king moved his court. Kraków is the older capital and still holds the castle, the cathedral and the royal tombs, which is why it does not feel like a provincial city."},
  {q:"In 1795 Poland was carved up and vanished from the map. Which three powers did it?",
   opts:["Russia, Prussia and Austria","Germany, Russia and the Ottoman Empire",
         "Sweden, Russia and Prussia","France, Austria and Russia"],
   a:0, note:"Russia, Prussia and Austria. Sweden is the good red herring, having invaded and devastated Poland in the 1650s in an episode Poles call the Deluge. Germany did not yet exist as a country in 1795."},
  {q:"Solidarity, the movement that helped end communism in Eastern Europe, began how?",
   opts:["A student uprising in Kraków","A miners' strike in Silesia",
         "A shipyard strike in Gdańsk","A church campaign in Warsaw"],
   a:2, note:"A strike at the Gdańsk shipyard in 1980, which became the first independent trade union in the Soviet bloc. The Kraków option is the plausible trap, and the district you visit on the second day was one of the movement's strongholds."},
  {q:"When was Poland invaded by Germany in WW2?",
   opts:["March 1938","September 1939",
         "November 1939","May 1940"],
   a:1, note:"1 September 1939, and the date the war is usually said to start. The Soviet Union invaded from the east on 17 September under a pact the two had signed in August, so Poland was crushed from both sides within a fortnight, which is why Poles remember the war differently from the British. March 1938 is the German annexation of Austria and May 1940 is the invasion of France and the Low Countries, both close enough to catch anyone whose dates have blurred."},
  {q:"Three of these are Polish dishes. Which one is not?",
   opts:["Bigos, a slow-cooked cabbage and meat stew","Goulash, a paprika beef stew",
         "Żurek, a sour soup made from fermented rye","Pierogi, filled dumplings"],
   a:1, note:"Goulash is Hungarian, though you will find it on menus here. Żurek is the one that sounds invented and is not: the soup is genuinely soured with fermented rye flour, and it is often served in a hollowed-out loaf."},
  {q:"What year did Poland join the EU?",
   opts:["1995","2001","2004","2007"],
   a:2, note:"1 May 2004, when ten countries joined at once and Poland was much the largest of them. The other three are all real dates attached to something else. 1995 is the enlargement that took in Austria, Finland and Sweden, while Poland was only three years into its application. 2001 falls in the middle of the accession negotiations, which ran from 1998 to the end of 2002 and were followed by a Polish referendum in 2003. And 2007 is when Poland entered the Schengen area and the border checks actually disappeared, which is the one most likely to catch somebody who was here at the time."}
 ]}
];
/* ===== food and drink: what it is, and how it became Polish ===== */
const FOOD=[
{group:"Five worth prioritising", note:"If you eat nothing else from this list.",
 items:[
 {n:"Żurek", d:"Sour rye soup, and the one nobody in the group will have met before. It explains Polish cooking better than any other single dish.", src:[["Saveur: what Polish food actually was before potatoes","https://www.saveur.com/culture/new-polish-cuisine"]]},
 {n:"Kremówka", d:"A vanilla slice with a papal endorsement. The story is better than the cake, and the cake is very good.", src:[["VisitMałopolska: what the pope actually said, in 1999","https://visitmalopolska.pl/en_GB/kuchnia-regionalna"],["The Viennese confectioner who baked the originals","https://annainthekitchen.com/polish-papal-cream-cake/"]]},
 {n:"Kompot", d:"Stewed fruit juice, poured from a jug, included with every milk bar lunch. Different every time, so it can be collected.", src:[["Culture.pl: milk bars, where you will meet it","https://culture.pl/en/article/milk-bars-a-taste-of-poland"]]},
 {n:"Bigos", d:"The national dish, and the one carrying the most history per mouthful. If one person orders it, everyone should taste it.", src:[["Wikipedia: Bigos","https://en.wikipedia.org/wiki/Bigos"]]},
 {n:"Oscypek", d:"Grilled sheep's cheese from a street stall, protected by European law, stamped with the shepherd's own pattern. The most distinctive flavour in the country.", src:[["The history and the PDO status","https://cheesescientist.com/trivia/oscypek/"],["VisitMałopolska: regional cuisine","https://visitmalopolska.pl/en_GB/kuchnia-regionalna"]]}]},

{group:"Soups", note:"Poland takes soup more seriously than anywhere else in Europe.",
 more:[["Culture.pl: ten meals from ten Polish regions","https://culture.pl/en/article/ten-meals-from-ten-polish-regions"]], items:[
 {n:"Żurek", d:"Sour rye soup, made by fermenting rye flour and water for several days until it turns sharp. Peasants kept a jar of the starter permanently going, which meant a hot meal from almost nothing. Served with white sausage and half a boiled egg, sometimes inside a hollowed-out loaf.", src:[["Saveur: what Polish food actually was before potatoes","https://www.saveur.com/culture/new-polish-cuisine"]]},
 {n:"Barszcz czerwony", d:"Clear beetroot soup, deep red, sour and faintly sweet. Beetroot grows in poor soil and stores through a long winter, which is how it became a fixture. At Christmas it arrives with tiny mushroom dumplings floating in it.", src:[["Culture.pl: ten meals from ten regions","https://culture.pl/en/article/ten-meals-from-ten-polish-regions"]]},
 {n:"Rosół", d:"Clear chicken broth with noodles, the Sunday soup of every Polish household. The name shares a root with the word for brine. Poles treat it as medicine, comfort, and the correct opening to any large family lunch.", src:[["Wikipedia: Polish cuisine","https://en.wikipedia.org/wiki/Polish_cuisine"]]},
 {n:"Flaki", d:"Tripe soup seasoned with marjoram, and genuinely popular rather than a curiosity. The classic hangover cure, which is how it survived into the modern menu.", src:[["Wikipedia: Polish cuisine","https://en.wikipedia.org/wiki/Polish_cuisine"]]}]},

{group:"The famous ones", note:"What Poles cook when they are cooking for other Poles.",
 more:[["Culture.pl: Pierogi and Other Stories","https://culture.pl/en/pierogi-other-stories"]], items:[
 {n:"Pierogi", d:"Filled dumplings, boiled and sometimes fried afterwards. The classic fillings are ruskie, potato and curd cheese, named for the Ruthenian lands rather than Russia; then meat, sauerkraut and mushroom, and sweet ones with blueberries. Legend credits a 13th-century Kraków bishop with bringing them back from the east, though historians treat that as invention. They spread because they stretch a little filling across a great deal of cheap flour.", src:[["Culture.pl: Pierogi and Other Stories","https://culture.pl/en/pierogi-other-stories"],["Wikipedia: Pierogi","https://en.wikipedia.org/wiki/Pierogi"]]},
 {n:"Bigos", d:"Hunter's stew of sauerkraut, fresh cabbage, several meats, mushrooms and sometimes prunes, cooked and reheated over days until everything collapses together. It suited hunting parties and long winters, improves every time it is warmed, and appears in Poland's national epic poem, which sealed its reputation.", src:[["Wikipedia: Bigos","https://en.wikipedia.org/wiki/Bigos"]]},
 {n:"Gołąbki", d:"Cabbage leaves rolled round minced meat and rice, baked in tomato sauce. The name means little pigeons. Legend has a Polish king feeding his army on them before a battle with the Teutonic Knights, which is almost certainly invented, and tells you exactly how Poles like their food stories.", src:[["Wikipedia: Gołąbki","https://en.wikipedia.org/wiki/Go%C5%82%C4%85bki"]]},
 {n:"Kotlet schabowy", d:"Breaded pork cutlet, beaten thin and fried. Austrian schnitzel arrived through Galicia in the 19th century, when Kraków sat under Viennese rule, and Poland kept it. The Sunday dinner of the communist decades, and still the default order.", src:[["Wikipedia: Kotlet schabowy","https://en.wikipedia.org/wiki/Kotlet_schabowy"]]},
 {n:"Placki ziemniaczane", d:"Potato pancakes, grated and fried crisp. Eaten plain with sour cream, or po zbójnicku, bandit style, buried under goulash. The bandit version comes down from the Tatra highlands and defeats most people.", src:[["Culture.pl: ten meals from ten regions","https://culture.pl/en/article/ten-meals-from-ten-polish-regions"]]},
 {n:"Golonka", d:"Pork knuckle, slow-cooked and often braised in beer, served with horseradish and mustard. Beer-hall food. One portion feeds two."}]},

{group:"Kraków's own", note:"Things you will struggle to find properly outside this city.",
 more:[["VisitMałopolska: regional cuisine","https://visitmalopolska.pl/en_GB/kuchnia-regionalna"]], items:[
 {n:"Obwarzanek krakowski", d:"The braided ring bread, boiled and then baked, first recorded in the royal accounts on 2 March 1394 as an item bought for the queen. It received European protected status in 2010, and only bakers in Kraków and two neighbouring districts may legally use the name. The twist down the side is what separates it from a bagel.", src:[["The Living Obwarzanek Museum","https://www.muzeumobwarzanka.com/historia-obwarzanka/?lang=en"],["The legal specification that defines one","https://assets.publishing.service.gov.uk/media/6772c4bd2554737c528474f2/Product_specification_Obwarzanek_krakowski_wniosek_EN.docx.pdf"]]},
 {n:"Maczanka krakowska", d:"Slow-braised pork neck in a soft roll, dunked in its own gravy. It fed the cab drivers waiting on the ranks in the 19th century, faded almost to extinction under communism, and has been revived over the last decade by a handful of bars and food trucks.", src:[["VisitMałopolska: regional cuisine","https://visitmalopolska.pl/en_GB/kuchnia-regionalna"]]},
 {n:"Zapiekanka", d:"Half a baguette with mushrooms and cheese, grilled and finished with ketchup. A creature of the 1970s, designed around scarcity: no meat, no plate, no cutlery, eaten standing up. It should have died with the shortage economy and instead became a national comfort food with a nostalgic edge.", src:[["In Your Pocket: Plac Nowy and the rotunda","https://www.inyourpocket.com/krakow/plac-nowy_21423v"]]},
 {n:"Kiełbasa lisiecka", d:"A protected sausage from Liszki, just west of the city, made from coarsely chopped ham and heavily peppered. Genuinely local, and worth asking for by name rather than accepting whatever sausage appears."},
 {n:"Jagodzianka", d:"A sweet yeast bun crammed with blueberries until it stains your fingers, sold everywhere through the summer. Poles queue for good ones and argue at length about which bakery makes the best."}]},

{group:"Cold plates and preserved things", note:"The Polish larder, built for winter.",
 more:[["Saveur: the new face of Polish cooking","https://www.saveur.com/culture/new-polish-cuisine"]], items:[
 {n:"Śledź", d:"Herring, served in oil with onion, or in cream with apple. Baltic fish that kept through the winter once salted, and traditionally eaten with a glass of very cold vodka rather than as a course on its own.", src:[["Saveur: fasting, fish and the Polish table","https://www.saveur.com/culture/new-polish-cuisine"]]},
 {n:"Smalec", d:"Rendered pork fat with crackling and pieces of apple, spread on dark bread and eaten with pickles. Often arrives free on the table in beer halls. Absurdly good, and best not thought about too carefully."},
 {n:"Oscypek", d:"Smoked sheep's cheese from the Tatra mountains, pressed in carved wooden moulds into a spindle shape, then smoked over a fire. It carries European protected status, and the pattern on the surface identifies the shepherd who made it. Sold grilled with cranberry from street stalls.", src:[["The history and the PDO status","https://cheesescientist.com/trivia/oscypek/"],["VisitMałopolska: regional cuisine","https://visitmalopolska.pl/en_GB/kuchnia-regionalna"]]},
 {n:"Ogórki kiszone", d:"Fermented cucumbers, sour rather than vinegary, which is the whole difference from a British gherkin. Poland ferments where Britain pickles, and the leftover brine turns into soup.", src:[["Saveur: why Poland ferments rather than pickles","https://www.saveur.com/culture/new-polish-cuisine"]]}]},

{group:"Sweet things", note:"Poland's cake culture runs deeper than its reputation suggests.",
 more:[["VisitMałopolska: the papal cream cake","https://visitmalopolska.pl/en_GB/kuchnia-regionalna"]], items:[
 {n:"Kremówka", d:"A vanilla slice: two sheets of pastry around a thick custard cream. It became nationally famous in 1999 when John Paul II publicly reminisced about eating them as a schoolboy in Wadowice, and Poland promptly began calling it kremówka papieska, the papal cream cake.", src:[["VisitMałopolska: what the pope actually said, in 1999","https://visitmalopolska.pl/en_GB/kuchnia-regionalna"],["The Viennese confectioner who baked the originals","https://annainthekitchen.com/polish-papal-cream-cake/"]]},
 {n:"Sernik", d:"Baked cheesecake made with twaróg, a dry curd cheese, which gives a denser and far less sweet result than the American version. The Kraków variant is often studded with raisins.", src:[["Culture.pl: Pierogi and Other Stories","https://culture.pl/en/pierogi-other-stories"]]},
 {n:"Szarlotka", d:"Apple pie with a crumbly shortcrust base and a mountain of apple on top, served warm, sometimes with cream. Poland grows apples in enormous quantities and a great many of them end up here."},
 {n:"Pączki", d:"Doughnuts, traditionally filled with rose petal jam rather than fruit. Eaten in vast quantities on Fat Thursday before Lent, when the country gets through hundreds of millions of them in a single day.", src:[["What to eat in Kraków","https://krakvel.com/en/travel-guide/what-to-eat-in-krakow-traditional-polish-dishes-to-try"]]},
 {n:"Makowiec", d:"Poppy seed roll, a dark spiral running through sweet yeast dough. Poppy seeds carried old associations with sleep, wealth and the dead, which is why the cake belongs to Christmas."}]},

{group:"Alcoholic drinks", note:"Most of these are meant to be drunk with food, not instead of it.",
 more:[["Tasting Poland: mead, and how it lost to vodka","https://www.tastingpoland.com/food/polish_mead_miod.html"]], items:[
 {n:"Wódka", d:"Poland and Russia both claim the invention and neither can settle it. Polish written records of production run to the early 1400s, and Poland's case rests on that documentation. Historically distilled from rye or potato, served very cold, neat, in one go, and traditionally alongside food.", src:[["Wikipedia: Polish cuisine","https://en.wikipedia.org/wiki/Polish_cuisine"]]},
 {n:"Żubrówka", d:"Bison grass vodka, flavoured with a blade of grass from the Białowieża forest where Europe's last wild bison live. Every bottle contains a single stalk. Mixed with apple juice it becomes a szarlotka, named after the apple pie.", src:[["Wikipedia: Żubrówka","https://en.wikipedia.org/wiki/%C5%BBubr%C3%B3wka"]]},
 {n:"Miód pitny", d:"Mead, Poland's oldest alcoholic drink, made from honey and water and graded by dilution: półtorak is the strongest and sweetest, trójniak the lightest. It predates the Polish state and appears in the earliest chronicles.", src:[["Wikipedia: Mead in Poland","https://en.wikipedia.org/wiki/Mead_in_Poland"],["A Kraków meadery, and a dragon who served mead","https://freewalkingtour.com/blog/mead-and-poland-a-bit-of-history-and-a-few-tips-on-which-polish-meads-to-try/"]]},
 {n:"Śliwowica", d:"Plum brandy, and the fierce one. The version from Łącko, south of Kraków, is famous, frequently home-made, and can run well past fifty per cent. Usually offered after dinner by somebody quietly testing you."},
 {n:"Nalewki", d:"Home-infused liqueurs, made by steeping cherries, plums, quince or walnuts in spirit for months. Every family had its own recipe, and a number of restaurants still make their own rather than buying in.", src:[["Tasting Poland: meads, nalewki and the rest","https://www.tastingpoland.com/food/polish_mead_miod.html"]]},
 {n:"Piwo", d:"Beer, and what Poles actually drink most. Order piwo z sokiem, beer with a shot of raspberry syrup, and watch the older members of the group react.", src:[["Wikipedia: Polish cuisine","https://en.wikipedia.org/wiki/Polish_cuisine"]]}]},

{group:"Non-alcoholic drinks", note:"Where Poland differs most from British habits.",
 more:[["Culture.pl: Milk Bars, a Taste of Poland","https://culture.pl/en/article/milk-bars-a-taste-of-poland"],["Rick Steves on the milk bar subsidy","https://www.ricksteves.com/watch-read-listen/read/articles/nostalgia-in-a-polish-milk-bar"]], items:[
 {n:"Kompot", d:"Fruit cooked in water with a little sugar and drunk cool: apples, plums, cherries, rhubarb, whatever the orchard produced. It exists because families preserved fruit and needed to use it up, and it remains the default drink in every milk bar.", src:[["Culture.pl: milk bars, where you will meet it","https://culture.pl/en/article/milk-bars-a-taste-of-poland"]]},
 {n:"Oranżada", d:"Fizzy orange drink, sold through the communist decades in bottles with ceramic swing tops, and now sold on nostalgia at least as much as on taste.", src:[["Saveur: a milk bar crawl through Kraków","https://www.saveur.com/culture/best-milk-bars-krakow/"]]},
 {n:"Herbata", d:"Tea, drunk black with lemon rather than milk, and often served in a glass rather than a cup. Adding milk reads as distinctly strange here. Ask for herbata z cytryną."},
 {n:"Kawa po turecku", d:"Turkish coffee, meaning grounds with boiling water poured straight over them in a glass, with no filter at all. The default coffee for decades, and still what an older Pole may put in front of you at home."},
 {n:"Wedel hot chocolate", d:"Thick drinking chocolate from a Warsaw company founded in 1851 that survived partition, war and nationalisation. Closer to melted chocolate than to cocoa."}]}
];
